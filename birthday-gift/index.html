<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Love Story</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Inter:wght@400;600;700&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Inter',sans-serif}
canvas{display:block;width:100%;height:100%}
#ui{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10}

/* Title overlay */
#titleOverlay{position:fixed;top:0;left:0;width:100%;height:100%;z-index:20;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at center,#1a1035,#080818);cursor:pointer;pointer-events:auto;
  transition:opacity 1.5s ease}
#titleOverlay.hide{opacity:0;pointer-events:none}
.t1{font-family:'Dancing Script',cursive;font-size:clamp(32px,8vw,56px);
  background:linear-gradient(135deg,#f9a8d4,#c084fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  opacity:0;animation:fadeUp 2s ease .3s forwards}
.t2{font-family:'Caveat',cursive;font-size:clamp(20px,5vw,30px);color:#f9a8d4;
  margin-top:16px;opacity:0;animation:fadeUp 2s ease 1.2s forwards}
.t3{font-size:13px;color:rgba(255,255,255,.3);position:absolute;bottom:50px;
  opacity:0;animation:fadeUp 2s ease 2.5s forwards}
@keyframes fadeUp{to{opacity:1}}

/* Letterbox */
.lbox{position:fixed;left:0;width:100%;height:0;background:#000;z-index:15;transition:height .8s ease}
.lbox.top{top:0}.lbox.bot{bottom:0}
.lbox.on{height:8vh}

/* Skip button */
#skipBtn{position:fixed;top:20px;right:20px;z-index:30;background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.2);color:#fff;padding:8px 20px;border-radius:20px;
  font-size:13px;cursor:pointer;pointer-events:auto;opacity:0;transition:opacity .5s}
#skipBtn.show{opacity:1}
#skipBtn:hover{background:rgba(255,255,255,.2)}

/* Quiz */
#quizOverlay{position:fixed;top:0;left:0;width:100%;height:100%;z-index:25;
  display:none;pointer-events:auto;
  background:linear-gradient(135deg,#0f0a1e,#1a0a2e)}
.quiz-wrap{max-width:500px;margin:0 auto;padding:30px 20px;height:100%;display:flex;flex-direction:column;justify-content:center}
.quiz-q{font-size:clamp(18px,4.5vw,24px);color:#f0e6ff;text-align:center;margin-bottom:30px;
  font-weight:600;line-height:1.4}
.quiz-opts{display:flex;flex-direction:column;gap:12px}
.quiz-opt{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
  color:#e0d0ff;padding:14px 20px;border-radius:14px;font-size:16px;cursor:pointer;
  transition:all .3s;text-align:center}
.quiz-opt:hover{background:rgba(168,85,247,.15);border-color:rgba(168,85,247,.4);transform:scale(1.02)}
.quiz-opt.correct{background:rgba(16,185,129,.25);border-color:#10b981;color:#6ee7b7}
.quiz-opt.wrong{background:rgba(239,68,68,.2);border-color:#ef4444;color:#fca5a5;animation:shake .5s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.quiz-score{text-align:center;color:#a78bfa;font-size:14px;margin-bottom:20px}
.quiz-popup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  background:rgba(15,10,30,.95);border:1px solid rgba(255,255,255,.15);border-radius:20px;
  padding:40px;text-align:center;max-width:400px;width:90%;z-index:30;backdrop-filter:blur(20px)}
.quiz-popup h2{font-family:'Dancing Script',cursive;font-size:28px;margin-bottom:15px}
.quiz-popup p{color:#c4b5fd;margin-bottom:20px;line-height:1.5}
.quiz-popup button{background:linear-gradient(135deg,#a855f7,#ec4899);border:none;color:#fff;
  padding:12px 30px;border-radius:25px;font-size:16px;cursor:pointer;font-weight:600}
.quiz-popup button:hover{transform:scale(1.05)}

/* Gift */
#giftOverlay{position:fixed;top:0;left:0;width:100%;height:100%;z-index:26;
  display:none;pointer-events:auto;
  background:radial-gradient(ellipse at center,#1a0a2e,#080818);
  flex-direction:column;align-items:center;justify-content:center}
.gift-title{font-family:'Dancing Script',cursive;font-size:clamp(28px,7vw,48px);
  background:linear-gradient(135deg,#f9a8d4,#c084fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  margin-bottom:30px;text-align:center}
.teddy-container{width:200px;height:200px;animation:teddyBounce 2s ease-in-out infinite}
@keyframes teddyBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}
.gift-msg{color:#c4b5fd;font-size:18px;margin-top:25px;text-align:center;max-width:400px;line-height:1.6}
</style>
</head>
<body>

<div id="titleOverlay">
  <div class="t1">Our Love Story</div>
  <div class="t2">A tale written in the stars</div>
  <div class="t3">Tap anywhere to begin</div>
</div>

<canvas id="c"></canvas>
<div class="lbox top" id="lbTop"></div>
<div class="lbox bot" id="lbBot"></div>
<button id="skipBtn" onclick="skipToQuiz()">Skip to Quiz →</button>

<div id="quizOverlay"></div>
<div id="giftOverlay"></div>

<script>
const C = document.getElementById('c');
const ctx = C.getContext('2d');
let W, H, dpr;
let currentScene = -1;
let sceneTime = 0;
let animFrame;
let sceneStartTime = 0;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  C.width = W * dpr;
  C.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// Easing functions
const ease = {
  linear: t => t,
  inOut: t => t < .5 ? 2*t*t : -1+(4-2*t)*t,
  out: t => 1-(1-t)*(1-t),
  in: t => t*t,
  outBack: t => { const s=1.7; return 1+(--t)*t*((s+1)*t+s); },
  outElastic: t => t===0?0:t===1?1:Math.pow(2,-10*t)*Math.sin((t-.075)*(2*Math.PI)/.3)+1,
  inOutCubic: t => t<.5?4*t*t*t:(t-1)*(2*t-2)*(2*t-2)+1
};

function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function tween(start, end, duration, elapsed, easeFn) {
  const t = clamp(elapsed / duration, 0, 1);
  return lerp(start, end, (easeFn || ease.inOut)(t));
}

// Particle system
class Particles {
  constructor() { this.p = []; }
  emit(x, y, count, opts = {}) {
    for (let i = 0; i < count; i++) {
      this.p.push({
        x, y, vx: (Math.random()-.5) * (opts.speed||4),
        vy: (Math.random()-.5) * (opts.speed||4) - (opts.rise||0),
        life: 1, decay: .008 + Math.random()*.015,
        size: opts.size || 2+Math.random()*3,
        color: opts.colors ? opts.colors[Math.floor(Math.random()*opts.colors.length)] : '#f9a8d4',
        type: opts.type || 'circle'
      });
    }
  }
  update() {
    for (let i = this.p.length-1; i >= 0; i--) {
      const p = this.p[i];
      p.x += p.vx; p.y += p.vy;
      p.vy += (p.type === 'confetti' ? .15 : .02);
      p.life -= p.decay;
      if (p.life <= 0) this.p.splice(i, 1);
    }
  }
  draw() {
    this.p.forEach(p => {
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      if (p.type === 'heart') {
        drawHeart(p.x, p.y, p.size * 2);
      } else if (p.type === 'confetti') {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.vx * sceneTime * .1);
        ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size * 1.5);
        ctx.restore();
      } else {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    });
  }
}
const particles = new Particles();

function drawHeart(x, y, size) {
  ctx.save();
  ctx.translate(x, y);
  const s = size / 15;
  ctx.beginPath();
  ctx.moveTo(0, -3*s);
  ctx.bezierCurveTo(-7.5*s, -12*s, -15*s, 0, 0, 10*s);
  ctx.bezierCurveTo(15*s, 0, 7.5*s, -12*s, 0, -3*s);
  ctx.fill();
  ctx.restore();
}

// Character drawing system - detailed cartoon style
function drawCharacter(x, y, scale, opts = {}) {
  const s = scale;
  const facing = opts.facing || 1; // 1=right, -1=left
  const armAngle = opts.armAngle || 0;
  const legPhase = opts.legPhase || 0;
  const headTilt = opts.headTilt || 0;
  const type = opts.type || 'guy'; // guy, girl, bride, groom
  const emotion = opts.emotion || 'normal'; // normal, happy, love, surprised

  ctx.save();
  ctx.translate(x, y);
  ctx.scale(facing, 1);

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,.15)';
  ctx.beginPath();
  ctx.ellipse(0, 0, 18*s, 5*s, 0, 0, Math.PI*2);
  ctx.fill();

  const skinTone = opts.skin || '#e8b89d';
  const hairColor = opts.hair || '#1a1a2e';

  if (type === 'guy' || type === 'groom') {
    const suitColor = type === 'groom' ? '#8B0000' : '#2d2b6e';
    const suitColor2 = type === 'groom' ? '#660000' : '#1e1b4b';

    // Legs with walking animation
    const legSwing = Math.sin(legPhase) * 15;
    ctx.save();
    // Left leg
    ctx.save();
    ctx.translate(-6*s, -35*s);
    ctx.rotate((legSwing) * Math.PI/180);
    ctx.fillStyle = '#1a1a2e';
    roundRect(-4*s, 0, 8*s, 35*s, 3*s);
    // Shoe
    ctx.fillStyle = '#111';
    roundRect(-5*s, 30*s, 12*s, 6*s, 3*s);
    ctx.restore();
    // Right leg
    ctx.save();
    ctx.translate(6*s, -35*s);
    ctx.rotate((-legSwing) * Math.PI/180);
    ctx.fillStyle = '#1a1a2e';
    roundRect(-4*s, 0, 8*s, 35*s, 3*s);
    ctx.fillStyle = '#111';
    roundRect(-5*s, 30*s, 12*s, 6*s, 3*s);
    ctx.restore();

    // Body / Suit jacket
    ctx.fillStyle = suitColor;
    roundRect(-16*s, -75*s, 32*s, 42*s, 6*s);
    // Lapels
    ctx.fillStyle = suitColor2;
    ctx.beginPath();
    ctx.moveTo(-10*s, -75*s);
    ctx.lineTo(0, -55*s);
    ctx.lineTo(10*s, -75*s);
    ctx.fill();
    // Tie
    ctx.fillStyle = type === 'groom' ? '#FFD700' : '#ec4899';
    ctx.beginPath();
    ctx.moveTo(-3*s, -73*s);
    ctx.lineTo(3*s, -73*s);
    ctx.lineTo(2*s, -55*s);
    ctx.lineTo(-2*s, -55*s);
    ctx.fill();
    // Shirt collar
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.moveTo(-8*s, -75*s);
    ctx.lineTo(0, -68*s);
    ctx.lineTo(8*s, -75*s);
    ctx.lineTo(5*s, -75*s);
    ctx.lineTo(0, -71*s);
    ctx.lineTo(-5*s, -75*s);
    ctx.fill();

    // Arms
    ctx.save();
    ctx.translate(-16*s, -70*s);
    ctx.rotate((armAngle - 10 + Math.sin(legPhase)* 10) * Math.PI/180);
    ctx.fillStyle = suitColor;
    roundRect(-4*s, 0, 10*s, 30*s, 4*s);
    ctx.fillStyle = skinTone;
    ctx.beginPath();
    ctx.arc(1*s, 33*s, 5*s, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.translate(16*s, -70*s);
    ctx.rotate((-armAngle + 10 - Math.sin(legPhase)* 10) * Math.PI/180);
    ctx.fillStyle = suitColor;
    roundRect(-6*s, 0, 10*s, 30*s, 4*s);
    ctx.fillStyle = skinTone;
    ctx.beginPath();
    ctx.arc(-1*s, 33*s, 5*s, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();

    // Neck
    ctx.fillStyle = skinTone;
    roundRect(-5*s, -82*s, 10*s, 10*s, 2*s);

    // Head
    ctx.save();
    ctx.translate(0, -98*s);
    ctx.rotate(headTilt * Math.PI/180);

    // Face
    ctx.fillStyle = skinTone;
    ctx.beginPath();
    ctx.ellipse(0, 0, 14*s, 16*s, 0, 0, Math.PI*2);
    ctx.fill();

    // Hair
    ctx.fillStyle = hairColor;
    ctx.beginPath();
    ctx.ellipse(0, -8*s, 15*s, 12*s, 0, Math.PI, Math.PI*2);
    ctx.fill();
    roundRect(-15*s, -12*s, 6*s, 12*s, 2*s);

    // Eyes
    drawEyes(0, -2*s, s, emotion, facing);

    // Mouth
    drawMouth(0, 7*s, s, emotion);

    // Eyebrows
    drawBrows(0, -7*s, s, emotion);

    ctx.restore();

    // Groom extras
    if (type === 'groom') {
      // Turban/pagdi
      ctx.save();
      ctx.translate(0, -98*s);
      ctx.fillStyle = '#FFD700';
      ctx.beginPath();
      ctx.ellipse(0, -16*s, 17*s, 10*s, 0, Math.PI, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#FF4500';
      ctx.beginPath();
      ctx.arc(0, -22*s, 5*s, 0, Math.PI*2);
      ctx.fill();
      // Feather
      ctx.fillStyle = '#FFD700';
      ctx.beginPath();
      ctx.ellipse(3*s, -28*s, 2*s, 8*s, .2, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    }

  } else if (type === 'girl' || type === 'bride') {
    const dressColor = type === 'bride' ? '#dc143c' : opts.dressColor || '#c084fc';
    const dressColor2 = type === 'bride' ? '#8B0000' : opts.dressColor2 || '#7c3aed';
    const hairCol = type === 'bride' ? '#0a0a0a' : hairColor;

    // Dress / Saree
    ctx.fillStyle = dressColor;
    ctx.beginPath();
    ctx.moveTo(-14*s, -72*s);
    ctx.lineTo(-22*s, -2*s);
    ctx.quadraticCurveTo(-22*s, 3*s, -18*s, 3*s);
    ctx.lineTo(18*s, 3*s);
    ctx.quadraticCurveTo(22*s, 3*s, 22*s, -2*s);
    ctx.lineTo(14*s, -72*s);
    ctx.fill();

    // Dress pattern/folds
    ctx.strokeStyle = dressColor2;
    ctx.lineWidth = 1.5*s;
    ctx.globalAlpha = .3;
    for (let i = 0; i < 4; i++) {
      ctx.beginPath();
      ctx.moveTo(-18*s+i*2*s, (-55+i*15)*s);
      ctx.quadraticCurveTo(0, (-45+i*15)*s, 18*s-i*2*s, (-55+i*15)*s);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    if (type === 'bride') {
      // Gold border at bottom
      ctx.fillStyle = '#FFD700';
      roundRect(-22*s, -8*s, 44*s, 8*s, 2*s);
      // Saree pallu over shoulder
      ctx.fillStyle = dressColor;
      ctx.globalAlpha = .7;
      ctx.beginPath();
      ctx.moveTo(-14*s, -72*s);
      ctx.quadraticCurveTo(-25*s, -50*s, -20*s, -30*s);
      ctx.lineTo(-12*s, -30*s);
      ctx.lineTo(-10*s, -72*s);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    // Feet
    ctx.fillStyle = type === 'bride' ? '#FFD700' : '#e8a0bf';
    const footSwing = Math.sin(legPhase) * 3;
    ctx.beginPath();
    ctx.ellipse(-7*s + footSwing, 4*s, 6*s, 3*s, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(7*s - footSwing, 4*s, 6*s, 3*s, 0, 0, Math.PI*2);
    ctx.fill();

    // Arms
    ctx.save();
    ctx.translate(-14*s, -65*s);
    ctx.rotate((armAngle - 5) * Math.PI/180);
    ctx.fillStyle = skinTone;
    roundRect(-3*s, 0, 7*s, 26*s, 3*s);
    ctx.beginPath();
    ctx.arc(0.5*s, 28*s, 4.5*s, 0, Math.PI*2);
    ctx.fill();
    if (type === 'bride') {
      ctx.fillStyle = '#FFD700';
      ctx.beginPath();
      ctx.arc(0.5*s, 24*s, 5*s, 0, Math.PI*2);
      ctx.lineWidth = 1.5*s;
      ctx.strokeStyle = '#FFD700';
      ctx.stroke();
    }
    ctx.restore();

    ctx.save();
    ctx.translate(14*s, -65*s);
    ctx.rotate((-armAngle + 5) * Math.PI/180);
    ctx.fillStyle = skinTone;
    roundRect(-4*s, 0, 7*s, 26*s, 3*s);
    ctx.beginPath();
    ctx.arc(-0.5*s, 28*s, 4.5*s, 0, Math.PI*2);
    ctx.fill();
    if (type === 'bride') {
      ctx.fillStyle = '#FFD700';
      ctx.beginPath();
      ctx.arc(-0.5*s, 24*s, 5*s, 0, Math.PI*2);
      ctx.lineWidth = 1.5*s;
      ctx.strokeStyle = '#FFD700';
      ctx.stroke();
    }
    ctx.restore();

    // Neck
    ctx.fillStyle = skinTone;
    roundRect(-4*s, -80*s, 8*s, 10*s, 2*s);
    if (type === 'bride') {
      // Necklace
      ctx.fillStyle = '#FFD700';
      ctx.beginPath();
      ctx.arc(0, -72*s, 8*s, -.3, Math.PI+.3);
      ctx.lineWidth = 2*s;
      ctx.strokeStyle = '#FFD700';
      ctx.stroke();
    }

    // Head
    ctx.save();
    ctx.translate(0, -95*s);
    ctx.rotate(headTilt * Math.PI/180);

    // Face
    ctx.fillStyle = skinTone;
    ctx.beginPath();
    ctx.ellipse(0, 0, 13*s, 15*s, 0, 0, Math.PI*2);
    ctx.fill();

    // Hair
    ctx.fillStyle = hairCol;
    ctx.beginPath();
    ctx.ellipse(0, -6*s, 15*s, 13*s, 0, Math.PI, Math.PI*2);
    ctx.fill();
    // Side hair
    roundRect(-15*s, -10*s, 5*s, 20*s, 2*s);
    roundRect(10*s, -10*s, 5*s, 20*s, 2*s);

    if (type === 'bride') {
      // Maang tikka
      ctx.fillStyle = '#FFD700';
      ctx.beginPath();
      ctx.arc(0, -14*s, 3*s, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#dc143c';
      ctx.beginPath();
      ctx.arc(0, -14*s, 1.5*s, 0, Math.PI*2);
      ctx.fill();
      // Bindi
      ctx.fillStyle = '#dc143c';
      ctx.beginPath();
      ctx.arc(0, -5*s, 2*s, 0, Math.PI*2);
      ctx.fill();
    }

    // Eyes (slightly larger, with lashes)
    drawEyes(0, -2*s, s * 1.05, emotion, facing, true);

    // Mouth
    drawMouth(0, 6*s, s, emotion);

    // Eyebrows
    drawBrows(0, -7*s, s * .9, emotion);

    // Earrings
    if (type === 'bride') {
      ctx.fillStyle = '#FFD700';
      ctx.beginPath(); ctx.arc(-13*s, 5*s, 3*s, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(13*s, 5*s, 3*s, 0, Math.PI*2); ctx.fill();
    }

    ctx.restore();

    // Long hair at back
    ctx.fillStyle = hairCol;
    ctx.beginPath();
    ctx.moveTo(-12*s, -100*s);
    ctx.quadraticCurveTo(-16*s, -60*s, -10*s, -35*s);
    ctx.lineTo(-6*s, -35*s);
    ctx.quadraticCurveTo(-12*s, -60*s, -8*s, -100*s);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(12*s, -100*s);
    ctx.quadraticCurveTo(16*s, -60*s, 10*s, -35*s);
    ctx.lineTo(6*s, -35*s);
    ctx.quadraticCurveTo(12*s, -60*s, 8*s, -100*s);
    ctx.fill();
  }

  ctx.restore();
}

function drawEyes(cx, cy, s, emotion, facing, lashes) {
  const gap = 7 * s;
  [-1, 1].forEach(side => {
    const ex = cx + side * gap;
    // Eye white
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.ellipse(ex, cy, 4*s, 3.5*s, 0, 0, Math.PI*2);
    ctx.fill();
    // Iris
    ctx.fillStyle = emotion === 'love' ? '#e11d48' : '#2d1b4e';
    ctx.beginPath();
    ctx.arc(ex + (facing||1)*s*.5, cy, 2.2*s, 0, Math.PI*2);
    ctx.fill();
    // Pupil
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(ex + (facing||1)*s*.5, cy, 1.2*s, 0, Math.PI*2);
    ctx.fill();
    // Highlight
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(ex + (facing||1)*s + s, cy - s, .8*s, 0, Math.PI*2);
    ctx.fill();
    // Lashes
    if (lashes) {
      ctx.strokeStyle = '#1a1a2e';
      ctx.lineWidth = 1.2*s;
      ctx.beginPath();
      ctx.arc(ex, cy, 4*s, -Math.PI*.85, -Math.PI*.15);
      ctx.stroke();
    }

    if (emotion === 'love') {
      // Heart eyes sparkle
      ctx.fillStyle = '#ec4899';
      drawHeart(ex, cy - 6*s, 3*s);
    }
  });
}

function drawMouth(cx, cy, s, emotion) {
  ctx.strokeStyle = '#8b4513';
  ctx.fillStyle = '#e8575f';
  ctx.lineWidth = 1.5*s;
  ctx.lineCap = 'round';
  if (emotion === 'happy' || emotion === 'love') {
    ctx.beginPath();
    ctx.arc(cx, cy - 2*s, 5*s, .15, Math.PI-.15);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(cx, cy - 2*s, 5*s, .2, Math.PI-.2);
    ctx.fill();
  } else if (emotion === 'surprised') {
    ctx.beginPath();
    ctx.ellipse(cx, cy, 3*s, 4*s, 0, 0, Math.PI*2);
    ctx.fill();
  } else {
    ctx.beginPath();
    ctx.arc(cx, cy, 4*s, .1, Math.PI-.1);
    ctx.stroke();
  }
}

function drawBrows(cx, cy, s, emotion) {
  ctx.strokeStyle = '#1a1a2e';
  ctx.lineWidth = 1.8*s;
  ctx.lineCap = 'round';
  const gap = 7*s;
  [-1, 1].forEach(side => {
    const bx = cx + side * gap;
    ctx.beginPath();
    if (emotion === 'surprised') {
      ctx.arc(bx, cy - 2*s, 4*s, Math.PI+.3, -0.3);
    } else if (emotion === 'love' || emotion === 'happy') {
      ctx.arc(bx, cy, 4*s, Math.PI+.5, -0.5);
    } else {
      ctx.moveTo(bx - 4*s, cy);
      ctx.lineTo(bx + 4*s, cy - s);
    }
    ctx.stroke();
  });
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y);
  ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h-r);
  ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h);
  ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.lineTo(x, y+r);
  ctx.quadraticCurveTo(x, y, x+r, y);
  ctx.fill();
}

function drawPhoto(x, y, w, h, t) {

  ctx.save();

  ctx.rotate(Math.sin(t*2) * .03);

  ctx.shadowColor = 'rgba(0,0,0,.3)';
  ctx.shadowBlur = 15;
  ctx.fillStyle = '#fff';
  roundRect(-w/2-8, -h/2-8, w+16, h+26, 4);
  ctx.shadowBlur = 0;

  // Photo content - girl's face
  ctx.fillStyle = '#fce7f3';
  ctx.fillRect(-w/2, -h/2, w, h);
  // Simple portrait
  ctx.fillStyle = '#e8b89d';
  ctx.beginPath();
  ctx.ellipse(0, -5, w*.25, w*.3, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#1a1a2e';
  ctx.beginPath();
  ctx.ellipse(0, -15, w*.3, w*.25, 0, Math.PI, Math.PI*2);
  ctx.fill();
  // Smile
  ctx.strokeStyle = '#c06040';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(0, 0, w*.1, .2, Math.PI-.2);

  // Eyes
  ctx.fillStyle = '#2d1b4e';
  ctx.beginPath(); ctx.arc(-w*.08, -6, 2.5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(w*.08, -6, 2.5, 0, Math.PI*2); ctx.fill();

  ctx.restore();
}

  ctx.beginPath();
  ctx.ellipse(W*.36, H*.54, 12, 4, 0, 0, Math.PI*2);

  ctx.fillStyle = '#a0522d';
  roundRect(W*.35, H*.48, 24, 20, 4);
  // Steam
  ctx.strokeStyle = 'rgba(255,255,255,.15)';

  for (let i = 0; i < 2; i++) {

function drawRoad(t) {
  // Sky
  const sky = ctx.createLinearGradient(0, 0, 0, H*.5);
  sky.addColorStop(0, '#1e1b4b');
  sky.addColorStop(1, '#4c1d95');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H*.5);

  // Distant buildings
  ctx.fillStyle = '#1a0f2e';
  for (let i = 0; i < 8; i++) {
    const bx = i * W/7 - (t*5)%40;
    const bh = 60 + (i*47)%80;
    ctx.fillRect(bx, H*.5-bh, W/8, bh);
    // Windows
    ctx.fillStyle = 'rgba(251,191,36,.15)';
    for (let r = 0; r < Math.floor(bh/20); r++) {
      for (let c = 0; c < 3; c++) {
        ctx.fillRect(bx+5+c*12, H*.5-bh+10+r*20, 6, 8);
      }
    }
    ctx.fillStyle = '#1a0f2e';
  }

  // Road
  ctx.fillStyle = '#2a2a3a';
  ctx.fillRect(0, H*.5, W, H*.5);

  // Lane markings
  ctx.fillStyle = '#fbbf24';
  ctx.globalAlpha = .6;
  const dashOffset = (t * 80) % 60;
  for (let i = -1; i < W/60+1; i++) {
    ctx.fillRect(i*60 - dashOffset, H*.72, 30, 4);
  }
  ctx.globalAlpha = 1;

  // Sidewalk
  ctx.fillStyle = '#3d3d4d';
  ctx.fillRect(0, H*.5, W, 15);
  ctx.fillRect(0, H*.92, W, H*.08);

  // Trees
  for (let i = 0; i < 3; i++) {
    const tx = W*.1 + i * W*.35;
    ctx.fillStyle = '#2d1b4e';
    ctx.fillRect(tx, H*.3, 8, H*.2);
    ctx.fillStyle = '#166534';
    ctx.beginPath();
    ctx.arc(tx+4, H*.28, 25, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#15803d';
    ctx.beginPath();
    ctx.arc(tx+10, H*.25, 18, 0, Math.PI*2);
    ctx.fill();
  }

  // Street lights
  ctx.fillStyle = '#555';
  ctx.fillRect(W*.85, H*.25, 4, H*.27);
  ctx.fillStyle = '#fbbf24';
  ctx.beginPath();
  ctx.arc(W*.87, H*.25, 8, 0, Math.PI*2);
  ctx.fill();
  const streetGlow = ctx.createRadialGradient(W*.87, H*.25, 4, W*.87, H*.45, 100);
  streetGlow.addColorStop(0, 'rgba(251,191,36,.1)');
  streetGlow.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = streetGlow;
  ctx.fillRect(W*.6, H*.1, W*.4, H*.5);
}

function drawBike(x, y, scale, t) {
  const s = scale;
  ctx.save();
  ctx.translate(x, y);

  // Wheels
  ctx.strokeStyle = '#555';
  ctx.lineWidth = 3*s;
  ctx.beginPath(); ctx.arc(-20*s, 15*s, 16*s, 0, Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.arc(20*s, 15*s, 16*s, 0, Math.PI*2); ctx.stroke();
  // Spokes
  ctx.lineWidth = 1*s;
  for (let i = 0; i < 6; i++) {
    const a = i * Math.PI/3 + t*3;
    [-20, 20].forEach(wx => {
      ctx.beginPath();
      ctx.moveTo(wx*s, 15*s);
      ctx.lineTo(wx*s + Math.cos(a)*14*s, 15*s + Math.sin(a)*14*s);
      ctx.stroke();
    });
  }
  // Hub
  ctx.fillStyle = '#777';
  ctx.beginPath(); ctx.arc(-20*s, 15*s, 3*s, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(20*s, 15*s, 3*s, 0, Math.PI*2); ctx.fill();

  // Frame
  ctx.strokeStyle = '#dc143c';
  ctx.lineWidth = 3*s;
  ctx.beginPath();
  ctx.moveTo(-20*s, 15*s); ctx.lineTo(0, -5*s); ctx.lineTo(20*s, 15*s);
  ctx.moveTo(0, -5*s); ctx.lineTo(-10*s, -15*s);
  ctx.moveTo(0, -5*s); ctx.lineTo(15*s, -5*s); ctx.lineTo(20*s, 15*s);
  ctx.stroke();

  // Handlebar
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 2.5*s;
  ctx.beginPath();
  ctx.moveTo(-15*s, -20*s); ctx.lineTo(-10*s, -15*s); ctx.lineTo(-5*s, -18*s);
  ctx.stroke();

  // Seat
  ctx.fillStyle = '#333';
  ctx.beginPath();
  ctx.ellipse(12*s, -8*s, 8*s, 3*s, -.1, 0, Math.PI*2);
  ctx.fill();

  ctx.restore();
}

function drawSunset(t) {
  // Sky gradient
  const sky = ctx.createLinearGradient(0, 0, 0, H*.7);
  sky.addColorStop(0, '#1e1b4b');
  sky.addColorStop(.3, '#4c1d95');
  sky.addColorStop(.5, '#7c2d9f');
  sky.addColorStop(.7, '#db2777');
  sky.addColorStop(.85, '#f97316');
  sky.addColorStop(1, '#fbbf24');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H*.7);

  // Sun
  const sunY = H*.45 + Math.sin(t*.3)*10;
  const sunGlow = ctx.createRadialGradient(W/2, sunY, 30, W/2, sunY, 200);
  sunGlow.addColorStop(0, 'rgba(251,191,36,.8)');
  sunGlow.addColorStop(.3, 'rgba(249,115,22,.4)');
  sunGlow.addColorStop(.6, 'rgba(219,39,119,.15)');
  sunGlow.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = sunGlow;
  ctx.fillRect(0, 0, W, H);
  // Sun disc
  ctx.fillStyle = '#fbbf24';
  ctx.beginPath();
  ctx.arc(W/2, sunY, 45 + Math.sin(t*2)*3, 0, Math.PI*2);
  ctx.fill();
  // Sun rays
  ctx.strokeStyle = 'rgba(251,191,36,.15)';
  ctx.lineWidth = 2;
  for (let i = 0; i < 12; i++) {
    const a = i * Math.PI/6 + t*.2;
    ctx.beginPath();
    ctx.moveTo(W/2 + Math.cos(a)*55, sunY + Math.sin(a)*55);
    ctx.lineTo(W/2 + Math.cos(a)*(90+Math.sin(t*3+i)*15), sunY + Math.sin(a)*(90+Math.sin(t*3+i)*15));
    ctx.stroke();
  }

  // Water
  const water = ctx.createLinearGradient(0, H*.65, 0, H);
  water.addColorStop(0, '#1e3a5f');
  water.addColorStop(.5, '#1a2d4a');
  water.addColorStop(1, '#0f1b2e');
  ctx.fillStyle = water;
  ctx.fillRect(0, H*.65, W, H*.35);

  // Water reflections
  ctx.globalAlpha = .15;
  for (let i = 0; i < 20; i++) {
    const ry = H*.68 + i * H*.015;
    const rw = (20 - i) * W*.015;
    ctx.fillStyle = i < 10 ? '#fbbf24' : '#f97316';
    ctx.fillRect(W/2 - rw/2 + Math.sin(t*2+i*.5)*10, ry, rw, 2);
  }
  ctx.globalAlpha = 1;

  // Water shimmer
  ctx.strokeStyle = 'rgba(255,255,255,.05)';
  ctx.lineWidth = 1;
  for (let i = 0; i < 30; i++) {
    const sx = (i * 67 + t*20)%W;
    const sy = H*.68 + (i * 31)%(H*.28);
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(sx + 15 + Math.sin(t+i)*5, sy);
    ctx.stroke();
  }
}

function drawMandap(t) {
  // Background
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#1a0a2e');
  bg.addColorStop(.5, '#2d1040');
  bg.addColorStop(1, '#1a0a2e');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // Floor
  const floorGrad = ctx.createRadialGradient(W/2, H*.85, 50, W/2, H*.85, W*.5);
  floorGrad.addColorStop(0, '#5b2e8a');
  floorGrad.addColorStop(1, '#2d1040');
  ctx.fillStyle = floorGrad;
  ctx.fillRect(0, H*.7, W, H*.3);

  // Rangoli pattern on floor
  ctx.strokeStyle = 'rgba(255,215,0,.2)';
  ctx.lineWidth = 1.5;
  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.arc(W/2, H*.85, 40+i*25, 0, Math.PI*2);
    ctx.stroke();
  }

  // Mandap pillars
  const pillarPositions = [W*.2, W*.35, W*.65, W*.8];
  pillarPositions.forEach((px, idx) => {
    // Pillar
    const pillarGrad = ctx.createLinearGradient(px-8, 0, px+8, 0);
    pillarGrad.addColorStop(0, '#8B0000');
    pillarGrad.addColorStop(.5, '#dc143c');
    pillarGrad.addColorStop(1, '#8B0000');
    ctx.fillStyle = pillarGrad;
    roundRect(px-8, H*.15, 16, H*.55, 4);
    // Gold bands
    ctx.fillStyle = '#FFD700';
    roundRect(px-10, H*.15, 20, 8, 3);
    roundRect(px-10, H*.68, 20, 8, 3);
    roundRect(px-9, H*.4, 18, 5, 2);
  });

  // Mandap roof
  ctx.fillStyle = '#8B0000';
  ctx.beginPath();
  ctx.moveTo(W*.15, H*.15);
  ctx.lineTo(W*.5, H*.02);
  ctx.lineTo(W*.85, H*.15);
  ctx.fill();
  // Gold trim
  ctx.strokeStyle = '#FFD700';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(W*.15, H*.15);
  ctx.lineTo(W*.5, H*.02);
  ctx.lineTo(W*.85, H*.15);
  ctx.stroke();

  // Garlands
  ctx.strokeStyle = '#f97316';
  ctx.lineWidth = 4;
  for (let g = 0; g < 3; g++) {
    ctx.beginPath();
    ctx.moveTo(W*.2, H*.15+g*3);
    ctx.quadraticCurveTo(W*.5, H*.25+Math.sin(t*2+g)*5+g*3, W*.8, H*.15+g*3);
    ctx.stroke();
  }
  // Flower details on garlands
  ctx.fillStyle = '#fbbf24';
  for (let i = 0; i < 15; i++) {
    const fx = W*.22 + i * (W*.56/14);
    const fy = H*.17 + Math.sin(i*.7)*8 + 5;
    ctx.beginPath();
    ctx.arc(fx, fy, 3, 0, Math.PI*2);
    ctx.fill();
  }

  // Sacred fire
  const fireX = W/2, fireY = H*.72;
  // Fire pit
  ctx.fillStyle = '#4a2020';
  ctx.beginPath();
  ctx.ellipse(fireX, fireY+5, 30, 10, 0, 0, Math.PI*2);
  ctx.fill();

  // Fire flames
  for (let i = 0; i < 8; i++) {
    const fx = fireX + Math.sin(t*5+i*1.3)*12;
    const fh = 25 + Math.sin(t*7+i*2)*12;
    const fw = 6 + Math.sin(t*4+i)*3;
    const grad = ctx.createLinearGradient(fx, fireY, fx, fireY-fh);
    grad.addColorStop(0, '#ff4500');
    grad.addColorStop(.4, '#ff6500');
    grad.addColorStop(.7, '#ffa500');
    grad.addColorStop(1, 'rgba(255,200,0,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(fx-fw, fireY);
    ctx.quadraticCurveTo(fx-fw/2, fireY-fh*.7, fx, fireY-fh);
    ctx.quadraticCurveTo(fx+fw/2, fireY-fh*.7, fx+fw, fireY);
    ctx.fill();
  }

  // Fire glow
  const fireGlow = ctx.createRadialGradient(fireX, fireY-10, 5, fireX, fireY-10, 120);
  fireGlow.addColorStop(0, 'rgba(255,165,0,.2)');
  fireGlow.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = fireGlow;
  ctx.fillRect(0, 0, W, H);

  // Diyas (oil lamps) on sides
  [-1, 1].forEach(side => {
    const dx = W/2 + side * W*.3;
    ctx.fillStyle = '#c2710a';
    ctx.beginPath();
    ctx.ellipse(dx, H*.75, 8, 4, 0, 0, Math.PI*2);
    ctx.fill();
    // Small flame
    const fGrad = ctx.createLinearGradient(dx, H*.75, dx, H*.72);
    fGrad.addColorStop(0, '#ff6500');
    fGrad.addColorStop(1, 'rgba(255,200,0,0)');
    ctx.fillStyle = fGrad;
    ctx.beginPath();
    ctx.moveTo(dx-3, H*.75);
    ctx.quadraticCurveTo(dx, H*.72 - Math.sin(t*6)*3, dx+3, H*.75);
    ctx.fill();
  });

  // Floating flower petals
  ctx.globalAlpha = .4;
  ['#ec4899','#f43f5e','#fbbf24','#f97316'].forEach((col, i) => {
    for (let j = 0; j < 4; j++) {
      const px = (W*.1 + (i*197+j*311)%W*.8);
      const py = (H*.1 + Math.sin(t*.8+i*2+j*1.3)*H*.12 + (j*151+i*89)%H*.5);
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.ellipse(px, py, 4, 2.5, t*.5+i+j, 0, Math.PI*2);
      ctx.fill();
    }
  });
  ctx.globalAlpha = 1;
}

function drawPhoneChat(t) {
  // Background
  ctx.fillStyle = '#0f0a1e';
  ctx.fillRect(0, 0, W, H);

  // Ambient
  const amb = ctx.createRadialGradient(W/2, H/2, 50, W/2, H/2, W*.5);
  amb.addColorStop(0, 'rgba(168,85,247,.08)');
  amb.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = amb;
  ctx.fillRect(0, 0, W, H);

  // Phone
  const pw = Math.min(220, W*.5), ph = pw*1.9;
  const px = W/2 - pw/2, py = H/2 - ph/2;

  // Phone shadow
  ctx.shadowColor = 'rgba(168,85,247,.3)';
  ctx.shadowBlur = 40;
  ctx.fillStyle = '#1a1a2e';
  roundRect(px-3, py-3, pw+6, ph+6, 24);
  ctx.shadowBlur = 0;

  // Phone body
  ctx.fillStyle = '#1a1a2e';
  roundRect(px, py, pw, ph, 22);

  // Screen
  ctx.fillStyle = '#0a0a15';
  roundRect(px+6, py+6, pw-12, ph-12, 18);

  // Status bar
  ctx.fillStyle = '#1a1a2e';
  roundRect(px+6, py+6, pw-12, 28, 18);
  ctx.fillStyle = 'rgba(255,255,255,.4)';
  ctx.font = '10px Inter';
  ctx.textAlign = 'left';
  ctx.fillText('9:41', px+18, py+24);

  // Chat header
  ctx.fillStyle = '#2d1b4e';
  roundRect(px+6, py+34, pw-12, 38, 0);
  ctx.fillStyle = '#f9a8d4';
  ctx.beginPath();
  ctx.arc(px+28, py+53, 12, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#e8b89d';
  ctx.beginPath();
  ctx.arc(px+28, py+51, 6, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = '600 13px Inter';
  ctx.fillText('My Love ❤️', px+48, py+57);

  return { px, py, pw, ph };
}

function drawChatBubble(phone, text, isMe, yOffset, progress) {
  if (progress <= 0) return;
  const { px, py, pw } = phone;
  const bw = Math.min(pw*.65, ctx.measureText(text).width + 28);
  const bh = 32;
  const bx = isMe ? px+pw-12-bw : px+16;
  const by = py + 85 + yOffset;

  ctx.globalAlpha = Math.min(progress * 2, 1);
  const scale = ease.outBack(Math.min(progress * 1.5, 1));
  ctx.save();
  ctx.translate(bx + (isMe ? bw : 0), by);
  ctx.scale(scale, scale);
  ctx.translate(-(bx + (isMe ? bw : 0)), -by);

  ctx.fillStyle = isMe ? '#7c3aed' : '#2d1b4e';
  roundRect(bx, by, bw, bh, 14);

  ctx.fillStyle = '#fff';
  ctx.font = '13px Inter';
  ctx.textAlign = isMe ? 'right' : 'left';
  ctx.fillText(text, isMe ? bx+bw-14 : bx+14, by+20);
  ctx.textAlign = 'left';

  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawMontagePanel(x, y, w, h, sceneFn, label) {
  ctx.save();
  ctx.beginPath();
  roundRectPath(x, y, w, h, 12);
  ctx.clip();
  sceneFn();
  ctx.restore();

  // Border
  ctx.strokeStyle = 'rgba(249,168,212,.3)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  roundRectPath(x, y, w, h, 12);
  ctx.stroke();
}

function roundRectPath(x, y, w, h, r) {
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y);
  ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h-r);
  ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h);
  ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.lineTo(x, y+r);
  ctx.quadraticCurveTo(x, y, x+r, y);
}

  ctx.fillRect(0, 0, W, H);

  // Birthday decorations
  // Balloons
  const balloonColors = ['#ec4899','#a855f7','#6366f1','#f43f5e','#fbbf24'];
  for (let i = 0; i < 8; i++) {
    const bx = W*.1 + i * W*.11;
    const by = H*.15 + Math.sin(t*1.5 + i)*15;
    ctx.fillStyle = balloonColors[i%balloonColors.length];
    ctx.beginPath();
    ctx.ellipse(bx, by, 18, 22, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = balloonColors[i%balloonColors.length];
    ctx.globalAlpha = .7;
    ctx.beginPath();
    ctx.moveTo(bx-3, by+22);
    ctx.lineTo(bx, by+28);
    ctx.lineTo(bx+3, by+22);
    ctx.fill();
    ctx.globalAlpha = 1;
    // String
    ctx.strokeStyle = 'rgba(255,255,255,.15)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(bx, by+28);
    ctx.quadraticCurveTo(bx+Math.sin(t+i)*5, by+50, bx, by+70);
    ctx.stroke();
    // Shine
    ctx.fillStyle = 'rgba(255,255,255,.3)';
    ctx.beginPath();
    ctx.ellipse(bx-5, by-6, 4, 6, -.3, 0, Math.PI*2);
    ctx.fill();
  }

  // Banner
  ctx.fillStyle = '#7c3aed';
  ctx.globalAlpha = .8;
  const bannerY = H*.32;
  ctx.beginPath();
  ctx.moveTo(W*.1, bannerY);
  ctx.lineTo(W*.9, bannerY);
  ctx.lineTo(W*.88, bannerY+35);
  ctx.lineTo(W*.12, bannerY+35);
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#fbbf24';
  ctx.font = `700 ${Math.min(24, W*.04)}px 'Dancing Script', cursive`;
  ctx.textAlign = 'center';
  ctx.fillText('🎂 Happy Birthday My Love! 🎂', W/2, bannerY+24);

  // Guy in suit
  drawCharacter(W/2, H*.78, 1.4, {
    type: 'guy', emotion: 'happy',
    armAngle: t > 2 ? -30 + Math.sin(t*3)*10 : 0,
    headTilt: Math.sin(t)*3
  });

  // Confetti
  if (Math.random() < .25) {
    particles.emit(Math.random()*W, -10, 1, {
      type: 'confetti',
      colors: ['#ec4899','#a855f7','#fbbf24','#6366f1','#34d399','#f43f5e'],
      speed: 3, rise: -2, size: 5
    });
  }

  // "Ready for your gift?" text after a moment
  if (t > 2.5) {
    const alpha = ease.out(clamp((t-2.5)/1, 0, 1));
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#fff';
    ctx.font = `600 ${Math.min(20, W*.035)}px Inter`;
    ctx.textAlign = 'center';
    ctx.fillText('But first... answer some questions! 😏', W/2, H*.52);
    ctx.globalAlpha = 1;
  }

  particles.update();
  particles.draw();
}

const sceneRenderers = [renderScene0, renderScene1, renderScene2, renderScene3, renderScene4, renderScene5, renderScene6, renderScene7];

// ==================== MAIN LOOP ====================

function render(now) {
  if (currentScene < 0) { animFrame = requestAnimationFrame(render); return; }

  const t = (now - sceneStartTime) / 1000;
  sceneTime = t;

  ctx.clearRect(0, 0, W, H);

  if (currentScene < sceneRenderers.length) {
    sceneRenderers[currentScene](t);
  }

  // Letterbox bars
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H*.06);
  ctx.fillRect(0, H*.94, W, H*.06);

  // Progress bar
  if (currentScene < 8) {
    const totalDur = SCENE_DURATIONS.reduce((a,b)=>a+b,0);
    let elapsed = 0;
    for (let i = 0; i < currentScene; i++) elapsed += SCENE_DURATIONS[i];
    elapsed += Math.min(t, SCENE_DURATIONS[currentScene]);
    const prog = elapsed / totalDur;
    ctx.fillStyle = 'rgba(255,255,255,.1)';
    ctx.fillRect(W*.1, H*.97, W*.8, 3);
    ctx.fillStyle = '#ec4899';
    roundRect(W*.1, H*.97, W*.8 * prog, 3, 1.5);
  }

  animFrame = requestAnimationFrame(render);
}

function startScene(idx) {
  if (idx >= sceneRenderers.length) {
    // Show quiz
    setTimeout(() => {
      document.getElementById('skipBtn').classList.remove('show');
      startQuiz();
    }, 500);
    return;
  }
  currentScene = idx;
  sceneStartTime = performance.now();
  particles.p = [];

  // Auto advance
  const dur = SCENE_DURATIONS[idx] * 1000;
  sceneTimers.push(setTimeout(() => {
    // Fade transition
    ctx.globalAlpha = 1;
    startScene(idx + 1);
  }, dur));
}

function beginFilm() {
  document.getElementById('titleOverlay').classList.add('hide');
  document.getElementById('lbTop').classList.add('on');
  document.getElementById('lbBot').classList.add('on');
  document.getElementById('skipBtn').classList.add('show');

  setTimeout(() => startScene(0), 800);
}

function skipToQuiz() {
  clearTimers();
  cancelAnimationFrame(animFrame);
  document.getElementById('skipBtn').classList.remove('show');
  document.getElementById('lbTop').classList.remove('on');
  document.getElementById('lbBot').classList.remove('on');
  startQuiz();
}

// ==================== QUIZ ====================

const questions = [
  {
    q: "When did I approach you?",
    options: ["Mar 31, 2025", "Apr 2, 2025", "Apr 4, 2025", "Apr 1, 2025"],
    correct: 1,
    wrongMsgs: [
      "Babe, really? 😭 That's not even close!",

      "I'm starting to question this relationship... 😤"
    ]
  },
  {
    q: "When was our First Kiss? 💋",
    options: ["Aug 13, 2025", "Aug 16, 2025", "Aug 15, 2025", "Aug 14, 2025"],
    correct: 2,
    wrongMsgs: [
      "HOW do you forget THIS?! 💀",
      "I can't believe you right now 😑",
      "That kiss meant NOTHING to you?! 😢"
    ]
  },
  {
    q: "When was our First Fight? 😤",
    options: ["Aug 25, 2025", "Aug 28, 2025", "Aug 26, 2025", "Aug 27, 2025"],
    correct: 2,
    wrongMsgs: [
      "Oh so fights don't matter to you? 😏",
      "Selective memory much? 🙄",
      "Even Google remembers better than you!"
    ]
  },
  {
    q: "Our Home Engagement happened on?",
    options: ["Aug 26, 2025", "Aug 29, 2025", "Aug 27, 2025", "Aug 28, 2025"],
    correct: 2,
    wrongMsgs: [

      "Should I return the ring? 🤔",

    ]
  },
  {

    wrongMsgs: [
      "Not the popcorn memories! 🍿😭",
      "I still have the ticket stub... do you? 🎫",
      "Wow, the disrespect is REAL 💔"
    ]
  }
];

let qIdx = 0, score = 0, answered = false;

function startQuiz() {
  cancelAnimationFrame(animFrame);
  const overlay = document.getElementById('quizOverlay');
  overlay.style.display = 'block';
  C.style.display = 'none';
  document.getElementById('lbTop').style.display = 'none';
  document.getElementById('lbBot').style.display = 'none';
  qIdx = 0; score = 0;
  loadQuestion();
}

function loadQuestion() {
  answered = false;
  const q = questions[qIdx];
  const overlay = document.getElementById('quizOverlay');
  overlay.innerHTML = `
    <div class="quiz-wrap">
      <div class="quiz-score">Question ${qIdx+1} of ${questions.length} • Score: ${score}/${qIdx}</div>
      <div class="quiz-q">${q.q}</div>
      <div class="quiz-opts">
        ${q.options.map((o,i) => `<div class="quiz-opt" onclick="pick(${i})">${o}</div>`).join('')}
      </div>
    </div>
  `;
}

function pick(idx) {
  if (answered) return;
  answered = true;
  const q = questions[qIdx];
  const opts = document.querySelectorAll('.quiz-opt');

  if (idx === q.correct) {
    opts[idx].classList.add('correct');
    opts[idx].textContent += ' ✅';
    score++;
  } else {
    opts[idx].classList.add('wrong');
    opts[q.correct].classList.add('correct');
    // Show funny message
    const msg = q.wrongMsgs[Math.floor(Math.random()*q.wrongMsgs.length)];
    showPopup(msg, false);
    return;
  }

  setTimeout(() => {
    qIdx++;
    if (qIdx < questions.length) loadQuestion();
    else finishQuiz();
  }, 1200);
}

function showPopup(msg, isEnd) {
  const overlay = document.getElementById('quizOverlay');
  const popup = document.createElement('div');
  popup.className = 'quiz-popup';
  popup.innerHTML = `
    <h2>${isEnd ? (score === questions.length ? '🎉 Perfect!' : '😅 Oops!') : '❌ Wrong!'}</h2>
    <p>${msg}</p>
    <button onclick="this.parentElement.remove();${isEnd ? (score === questions.length ? 'showGift()' : 'retryQuiz()') : 'nextAfterWrong()'}">${isEnd ? (score === questions.length ? 'Claim Your Gift! 🎁' : 'Try Again 💪') : 'Next Question →'}</button>
  `;
  overlay.appendChild(popup);
}

window.nextAfterWrong = function() {
  qIdx++;
  if (qIdx < questions.length) loadQuestion();
  else finishQuiz();
};

function retryQuiz() {
  qIdx = 0; score = 0;
  loadQuestion();
}

function finishQuiz() {
  if (score === questions.length) {
    showPopup("You really DO remember everything! 🥹💕 You've earned your gift!", true);
  } else {
    const msgs = [
      `${score}/${questions.length}?! My goldfish remembers better! 🐠`,
      `${score}/${questions.length}... I'm not angry, I'm disappointed 😤`,
      `Only ${score}/${questions.length}?! We need couples therapy! 💊`,
      `${score}/${questions.length}... Even autocorrect does better! 📱`
    ];
    showPopup(msgs[Math.floor(Math.random()*msgs.length)], true);
  }
}

function showGift() {
  document.getElementById('quizOverlay').style.display = 'none';
  const gift = document.getElementById('giftOverlay');
  gift.style.display = 'flex';

  // Draw teddy on a canvas
  gift.innerHTML = `
    <div class="gift-title">Your Gift Is Here! 🎁</div>
    <div class="teddy-container">
      <canvas id="teddyCanvas" width="200" height="200"></canvas>
    </div>
    <div class="gift-msg">
      A Big Teddy Bear! 🧸<br>
      <span style="font-size:14px;color:#a78bfa">Because you deserve all the cuddles in the world 💕</span>
    </div>
  `;

  drawTeddy();
  launchGiftConfetti();
}

function drawTeddy() {
  const tc = document.getElementById('teddyCanvas');
  if (!tc) return;
  const t = tc.getContext('2d');

  // Body
  t.fillStyle = '#8B6914';
  t.beginPath(); t.ellipse(100, 130, 50, 55, 0, 0, Math.PI*2); t.fill();

  // Belly
  t.fillStyle = '#C4A24E';
  t.beginPath(); t.ellipse(100, 135, 30, 35, 0, 0, Math.PI*2); t.fill();

  // Head
  t.fillStyle = '#8B6914';
  t.beginPath(); t.ellipse(100, 65, 40, 38, 0, 0, Math.PI*2); t.fill();

  // Inner face
  t.fillStyle = '#C4A24E';
  t.beginPath(); t.ellipse(100, 72, 25, 22, 0, 0, Math.PI*2); t.fill();

  // Ears
  t.fillStyle = '#8B6914';
  t.beginPath(); t.arc(65, 38, 15, 0, Math.PI*2); t.fill();
  t.beginPath(); t.arc(135, 38, 15, 0, Math.PI*2); t.fill();
  t.fillStyle = '#C4A24E';
  t.beginPath(); t.arc(65, 38, 8, 0, Math.PI*2); t.fill();
  t.beginPath(); t.arc(135, 38, 8, 0, Math.PI*2); t.fill();

  // Eyes
  t.fillStyle = '#1a1a2e';
  t.beginPath(); t.arc(85, 60, 5, 0, Math.PI*2); t.fill();
  t.beginPath(); t.arc(115, 60, 5, 0, Math.PI*2); t.fill();
  // Eye shine
  t.fillStyle = '#fff';
  t.beginPath(); t.arc(87, 58, 2, 0, Math.PI*2); t.fill();
  t.beginPath(); t.arc(117, 58, 2, 0, Math.PI*2); t.fill();

  // Nose
  t.fillStyle = '#333';
  t.beginPath(); t.ellipse(100, 72, 6, 4, 0, 0, Math.PI*2); t.fill();

  // Mouth
  t.strokeStyle = '#333';
  t.lineWidth = 2;
  t.beginPath(); t.arc(100, 75, 8, .2, Math.PI-.2); t.stroke();

  // Arms
  t.fillStyle = '#8B6914';
  t.beginPath(); t.ellipse(55, 115, 15, 28, .3, 0, Math.PI*2); t.fill();
  t.beginPath(); t.ellipse(145, 115, 15, 28, -.3, 0, Math.PI*2); t.fill();

  // Legs
  t.beginPath(); t.ellipse(78, 180, 18, 14, .2, 0, Math.PI*2); t.fill();
  t.beginPath(); t.ellipse(122, 180, 18, 14, -.2, 0, Math.PI*2); t.fill();
  // Paw pads
  t.fillStyle = '#C4A24E';
  t.beginPath(); t.ellipse(78, 182, 10, 8, .2, 0, Math.PI*2); t.fill();
  t.beginPath(); t.ellipse(122, 182, 10, 8, -.2, 0, Math.PI*2); t.fill();

  // Bow tie
  t.fillStyle = '#ec4899';
  t.beginPath();
  t.moveTo(100, 95);
  t.lineTo(85, 85); t.lineTo(85, 105);
  t.fill();
  t.beginPath();
  t.moveTo(100, 95);
  t.lineTo(115, 85); t.lineTo(115, 105);
  t.fill();
  t.fillStyle = '#f43f5e';
  t.beginPath(); t.arc(100, 95, 4, 0, Math.PI*2); t.fill();

  // Heart
  t.fillStyle = '#ec4899';
  t.save();
  t.translate(100, 135);
  const hs = 1;
  t.beginPath();
  t.moveTo(0, -3*hs);
  t.bezierCurveTo(-7.5*hs, -12*hs, -15*hs, 0, 0, 10*hs);
  t.bezierCurveTo(15*hs, 0, 7.5*hs, -12*hs, 0, -3*hs);
  t.fill();
  t.restore();
}

function launchGiftConfetti() {
  const gift = document.getElementById('giftOverlay');
  const confettiCanvas = document.createElement('canvas');
  confettiCanvas.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none';
  confettiCanvas.width = W * dpr;
  confettiCanvas.height = H * dpr;
  gift.appendChild(confettiCanvas);
  const cc = confettiCanvas.getContext('2d');
  cc.setTransform(dpr, 0, 0, dpr, 0, 0);

  const confetti = [];
  const colors = ['#ec4899','#a855f7','#fbbf24','#6366f1','#34d399','#f43f5e','#3b82f6'];
  for (let i = 0; i < 150; i++) {
    confetti.push({
      x: Math.random()*W, y: -Math.random()*H,
      vx: (Math.random()-.5)*4, vy: 1+Math.random()*3,
      size: 4+Math.random()*6, color: colors[Math.floor(Math.random()*colors.length)],
      rot: Math.random()*Math.PI*2, rotV: (Math.random()-.5)*.15
    });
  }

  function animConfetti() {
    cc.clearRect(0, 0, W, H);
    let active = false;
    confetti.forEach(c => {
      c.x += c.vx; c.y += c.vy; c.vy += .03; c.rot += c.rotV;
      if (c.y < H + 20) active = true;
      cc.save();
      cc.translate(c.x, c.y);
      cc.rotate(c.rot);
      cc.fillStyle = c.color;
      cc.fillRect(-c.size/2, -c.size/2, c.size, c.size*1.5);
      cc.restore();
    });
    if (active) requestAnimationFrame(animConfetti);
  }
  animConfetti();
}

// ==================== INIT ====================

document.getElementById('titleOverlay').addEventListener('click', beginFilm);
animFrame = requestAnimationFrame(render);
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Love Story</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:system-ui,-apple-system,sans-serif}
canvas{display:block;position:fixed;top:0;left:0;width:100vw;height:100vh}

#titleScreen{position:fixed;top:0;left:0;width:100%;height:100%;z-index:20;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 40%,#1e1040,#0a0612);cursor:pointer;
  transition:opacity 1.5s ease}
#titleScreen.gone{opacity:0;pointer-events:none}
#titleScreen h1{font-size:clamp(28px,7vw,52px);font-weight:300;letter-spacing:2px;
  background:linear-gradient(135deg,#f9a8d4,#c084fc,#f9a8d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  opacity:0;animation:fadeIn 2.5s ease .3s forwards}
#titleScreen p{color:rgba(255,255,255,.3);margin-top:12px;font-size:14px;letter-spacing:4px;
  opacity:0;animation:fadeIn 2s ease 2s forwards}
@keyframes fadeIn{to{opacity:1}}

#skipBtn{position:fixed;top:16px;right:16px;z-index:30;background:rgba(0,0,0,.5);
  border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.6);padding:8px 18px;
  border-radius:20px;font-size:12px;cursor:pointer;display:none;letter-spacing:1px}
#skipBtn:hover{background:rgba(255,255,255,.1)}

/* QUIZ OVERLAY */
#quizUI{position:fixed;top:0;left:0;width:100%;height:100%;z-index:25;display:none;
  background:linear-gradient(135deg,#0f0a1e,#1a0a2e)}
.qWrap{max-width:460px;margin:0 auto;padding:30px 20px;height:100%;display:flex;flex-direction:column;justify-content:center}
.qHead{text-align:center;color:rgba(255,255,255,.35);font-size:13px;letter-spacing:2px;margin-bottom:24px}
.qText{font-size:clamp(18px,4.5vw,22px);color:#f0e6ff;text-align:center;margin-bottom:32px;font-weight:600;line-height:1.5}
.qOpts{display:flex;flex-direction:column;gap:10px}
.qOpt{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
  color:#d4c4f0;padding:14px 20px;border-radius:12px;font-size:15px;cursor:pointer;
  transition:all .25s;text-align:center}
.qOpt:hover{background:rgba(168,85,247,.12);border-color:rgba(168,85,247,.3);transform:translateY(-1px)}
.qOpt.right{background:rgba(16,185,129,.2)!important;border-color:#10b981!important;color:#6ee7b7!important}
.qOpt.wrong{background:rgba(239,68,68,.15)!important;border-color:#ef4444!important;color:#fca5a5!important;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.popup{position:fixed;top:0;left:0;width:100%;height:100%;z-index:30;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.7);backdrop-filter:blur(8px)}
.popBox{background:rgba(20,10,40,.95);border:1px solid rgba(255,255,255,.1);border-radius:20px;
  padding:36px;text-align:center;max-width:380px;width:90%}
.popBox h3{font-size:22px;color:#f9a8d4;margin-bottom:12px;font-weight:600}
.popBox p{color:#c4b5fd;margin-bottom:24px;line-height:1.6;font-size:15px}
.popBox button{background:linear-gradient(135deg,#a855f7,#ec4899);border:none;color:#fff;
  padding:12px 28px;border-radius:25px;font-size:15px;cursor:pointer;font-weight:600;letter-spacing:.5px}
.popBox button:hover{filter:brightness(1.1);transform:scale(1.03)}

/* GIFT */
#giftUI{position:fixed;top:0;left:0;width:100%;height:100%;z-index:26;display:none;
  flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 40%,#1e0a30,#080612)}
#giftUI h2{font-size:clamp(26px,6vw,42px);font-weight:300;letter-spacing:2px;
  background:linear-gradient(135deg,#f9a8d4,#c084fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  margin-bottom:20px}
#giftUI canvas{animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
#giftUI .gMsg{color:#c4b5fd;font-size:16px;margin-top:20px;text-align:center;line-height:1.7;max-width:360px}
</style>
</head>
<body>

<div id="titleScreen">
  <h1>Our Love Story</h1>
  <p>tap to begin</p>
</div>
<canvas id="c"></canvas>
<button id="skipBtn" onclick="skipToQuiz()">SKIP ›</button>
<div id="quizUI"></div>
<div id="giftUI"></div>

<script>
// ─── CANVAS SETUP ───
const cv = document.getElementById('c'), cx = cv.getContext('2d');
let W, H, dpr;
function resize(){
  dpr = Math.min(devicePixelRatio||1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W*dpr; cv.height = H*dpr;
  cx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener('resize', resize); resize();

// ─── MATH HELPERS ───
const lerp = (a,b,t) => a+(b-a)*t;
const clamp = (v,lo,hi) => Math.max(lo,Math.min(hi,v));
const EI = t => t<.5?2*t*t:-1+(4-2*t)*t;
const EO = t => t*(2-t);
const EIB = t => {const s=1.5;return 1+(--t)*t*((s+1)*t+s)};
const prog = (elapsed, start, dur) => clamp((elapsed-start)/dur, 0, 1);

// ─── PARTICLES ───
let parts = [];
function emitP(x,y,n,o){
  for(let i=0;i<n;i++) parts.push({
    x, y, vx:(Math.random()-.5)*(o.sp||3), vy:(Math.random()-.5)*(o.sp||3)-(o.rise||0),
    life:1, dec:.006+Math.random()*.012,
    sz: o.sz||2+Math.random()*3,
    col: o.cols[~~(Math.random()*o.cols.length)],
    shape: o.shape||'dot'
  });
}
function tickParts(){
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i]; p.x+=p.vx; p.y+=p.vy;
    p.vy += p.shape==='confetti'?.12:.02;
    p.life-=p.dec;
    if(p.life<=0) parts.splice(i,1);
  }
}
function drawParts(){
  parts.forEach(p=>{
    cx.globalAlpha=p.life; cx.fillStyle=p.col;
    if(p.shape==='heart'){ drawHeart(p.x,p.y,p.sz*2); }
    else if(p.shape==='confetti'){
      cx.save(); cx.translate(p.x,p.y); cx.rotate(p.vx*sceneT*.1);
      cx.fillRect(-p.sz/2,-p.sz/2,p.sz,p.sz*1.4); cx.restore();
    } else { cx.beginPath(); cx.arc(p.x,p.y,p.sz,0,Math.PI*2); cx.fill(); }
    cx.globalAlpha=1;
  });
}
function drawHeart(x,y,s){
  cx.save(); cx.translate(x,y); const r=s/15;
  cx.beginPath(); cx.moveTo(0,-3*r);
  cx.bezierCurveTo(-7.5*r,-12*r,-15*r,0,0,10*r);
  cx.bezierCurveTo(15*r,0,7.5*r,-12*r,0,-3*r);
  cx.fill(); cx.restore();
}

// ─── DRAWING PRIMITIVES ───
function rr(x,y,w,h,r){
  cx.beginPath(); cx.moveTo(x+r,y); cx.lineTo(x+w-r,y);
  cx.quadraticCurveTo(x+w,y,x+w,y+r); cx.lineTo(x+w,y+h-r);
  cx.quadraticCurveTo(x+w,y+h,x+w-r,y+h); cx.lineTo(x+r,y+h);
  cx.quadraticCurveTo(x,y+h,x,y+h-r); cx.lineTo(x,y+r);
  cx.quadraticCurveTo(x,y,x+r,y); cx.closePath();
}
function fillRR(x,y,w,h,r){ rr(x,y,w,h,r); cx.fill(); }

// ─── CHARACTER SYSTEM ───
// Draws a stylized 2D character with proper proportions
function drawPerson(x, y, sc, o={}){
  const s = sc, face = o.face||1, walk = o.walk||0, arm = o.arm||0, tilt = o.tilt||0;
  const mood = o.mood||''; const kind = o.kind||'M';
  const skin = o.skin||'#e8b89d';

  cx.save(); cx.translate(x,y); cx.scale(face,1);

  // Shadow
  cx.fillStyle='rgba(0,0,0,.12)';
  cx.beginPath(); cx.ellipse(0,2,16*s,4*s,0,0,Math.PI*2); cx.fill();

  if(kind==='M'||kind==='GM'){
    const coat = kind==='GM'?'#8B0000':'#1e1b4b';
    const coat2 = kind==='GM'?'#600':'#12103a';

    // ── Legs ──
    [-1,1].forEach((side,i)=>{
      cx.save(); cx.translate(side*5*s, -30*s);
      cx.rotate((i===0?1:-1)*Math.sin(walk)*12*Math.PI/180);
      cx.fillStyle='#191930'; fillRR(-3.5*s,0,7*s,28*s,3*s);
      cx.fillStyle='#111'; fillRR(-4.5*s,24*s,10*s,5*s,2.5*s);
      cx.restore();
    });

    // ── Torso ──
    cx.fillStyle=coat; fillRR(-14*s,-65*s,28*s,38*s,5*s);
    // Lapel
    cx.fillStyle=coat2;
    cx.beginPath(); cx.moveTo(-8*s,-65*s); cx.lineTo(0,-50*s); cx.lineTo(8*s,-65*s); cx.fill();
    // Shirt
    cx.fillStyle='#eee';
    cx.beginPath(); cx.moveTo(-5*s,-65*s); cx.lineTo(0,-58*s); cx.lineTo(5*s,-65*s); cx.fill();
    // Tie
    cx.fillStyle = kind==='GM'?'#FFD700':'#c084fc';
    cx.beginPath(); cx.moveTo(-2*s,-64*s); cx.lineTo(2*s,-64*s);
    cx.lineTo(1.5*s,-50*s); cx.lineTo(-1.5*s,-50*s); cx.fill();

    // ── Arms ──
    [-1,1].forEach((side,i)=>{
      cx.save(); cx.translate(side*14*s,-60*s);
      const aRot = (side===1? arm : -arm) + Math.sin(walk+i*Math.PI)*8;
      cx.rotate(aRot*Math.PI/180);
      cx.fillStyle=coat; fillRR(-3.5*s,0,8*s,24*s,3*s);
      cx.fillStyle=skin; cx.beginPath(); cx.arc(.5*s,26*s,4*s,0,Math.PI*2); cx.fill();
      cx.restore();
    });

    // ── Neck ──
    cx.fillStyle=skin; fillRR(-4*s,-72*s,8*s,9*s,2*s);

    // ── Head ──
    cx.save(); cx.translate(0,-85*s); cx.rotate(tilt*Math.PI/180);
    cx.fillStyle=skin; cx.beginPath(); cx.ellipse(0,0,12*s,14*s,0,0,Math.PI*2); cx.fill();
    // Hair
    cx.fillStyle=o.hair||'#111';
    cx.beginPath(); cx.ellipse(0,-7*s,13*s,10*s,0,Math.PI,Math.PI*2); cx.fill();
    fillRR(-13*s,-10*s,5*s,8*s,2*s);
    // Eyes
    drawEyes(0,-1*s,s,mood);
    // Mouth
    drawMouth(0,6*s,s,mood);

    if(kind==='GM'){
      // Pagdi
      cx.fillStyle='#FFD700';
      cx.beginPath(); cx.ellipse(0,-14*s,15*s,9*s,0,Math.PI,Math.PI*2); cx.fill();
      cx.fillStyle='#ff4500'; cx.beginPath(); cx.arc(0,-20*s,4*s,0,Math.PI*2); cx.fill();
    }
    cx.restore();

  } else { // F or BF (female / bride female)
    const dress = kind==='BF'?'#dc143c': o.dress||'#c084fc';
    const dress2 = kind==='BF'?'#8B0000': o.dress2||'#7c3aed';

    // ── Dress ──
    cx.fillStyle=dress;
    cx.beginPath(); cx.moveTo(-12*s,-62*s); cx.lineTo(-19*s,-2*s);
    cx.quadraticCurveTo(-19*s,3*s,-15*s,3*s);
    cx.lineTo(15*s,3*s); cx.quadraticCurveTo(19*s,3*s,19*s,-2*s);
    cx.lineTo(12*s,-62*s); cx.fill();
    // Folds
    cx.strokeStyle=dress2; cx.lineWidth=1*s; cx.globalAlpha=.25;
    for(let i=0;i<3;i++){
      cx.beginPath(); cx.moveTo(-15*s+i*2*s,(-45+i*14)*s);
      cx.quadraticCurveTo(0,(-38+i*14)*s,15*s-i*2*s,(-45+i*14)*s); cx.stroke();
    }
    cx.globalAlpha=1;

    if(kind==='BF'){
      cx.fillStyle='#FFD700'; fillRR(-19*s,-7*s,38*s,6*s,1*s);
    }

    // Feet
    cx.fillStyle=kind==='BF'?'#FFD700':'#dba0c0';
    [-1,1].forEach(side=>{
      cx.beginPath(); cx.ellipse(side*6*s,4*s,5*s,2.5*s,0,0,Math.PI*2); cx.fill();
    });

    // ── Arms ──
    [-1,1].forEach((side,i)=>{
      cx.save(); cx.translate(side*12*s,-56*s);
      cx.rotate(((side===1?arm:-arm)+5)*Math.PI/180);
      cx.fillStyle=skin; fillRR(-3*s,0,6*s,22*s,3*s);
      cx.beginPath(); cx.arc(.5*s*side,24*s,4*s,0,Math.PI*2); cx.fill();
      if(kind==='BF'){
        cx.strokeStyle='#FFD700'; cx.lineWidth=2*s;
        cx.beginPath(); cx.arc(0,20*s,5*s,0,Math.PI*2); cx.stroke();
      }
      cx.restore();
    });

    // ── Neck ──
    cx.fillStyle=skin; fillRR(-3.5*s,-68*s,7*s,8*s,2*s);
    if(kind==='BF'){
      cx.strokeStyle='#FFD700'; cx.lineWidth=1.5*s;
      cx.beginPath(); cx.arc(0,-62*s,7*s,0,Math.PI); cx.stroke();
    }

    // ── Head ──
    cx.save(); cx.translate(0,-82*s); cx.rotate(tilt*Math.PI/180);
    cx.fillStyle=skin; cx.beginPath(); cx.ellipse(0,0,11*s,13*s,0,0,Math.PI*2); cx.fill();
    // Hair
    cx.fillStyle=o.hair||'#0a0a0a';
    cx.beginPath(); cx.ellipse(0,-5*s,13*s,11*s,0,Math.PI,Math.PI*2); cx.fill();
    fillRR(-13*s,-8*s,4.5*s,16*s,2*s);
    fillRR(8.5*s,-8*s,4.5*s,16*s,2*s);
    // Eyes (with lashes)
    drawEyes(0,-1*s,s,mood,true);
    drawMouth(0,5.5*s,s,mood);

    if(kind==='BF'){
      cx.fillStyle='#FFD700'; cx.beginPath(); cx.arc(0,-12*s,2.5*s,0,Math.PI*2); cx.fill();
      cx.fillStyle='#dc143c'; cx.beginPath(); cx.arc(0,-12*s,1.2*s,0,Math.PI*2); cx.fill();
      cx.fillStyle='#dc143c'; cx.beginPath(); cx.arc(0,-4*s,1.8*s,0,Math.PI*2); cx.fill();
      // Earrings
      cx.fillStyle='#FFD700';
      cx.beginPath(); cx.arc(-11*s,5*s,2.5*s,0,Math.PI*2); cx.fill();
      cx.beginPath(); cx.arc(11*s,5*s,2.5*s,0,Math.PI*2); cx.fill();
    }
    cx.restore();

    // Long hair strands
    cx.fillStyle=o.hair||'#0a0a0a';
    [-1,1].forEach(side=>{
      cx.beginPath(); cx.moveTo(side*10*s,-88*s);
      cx.quadraticCurveTo(side*14*s,-55*s,side*9*s,-30*s);
      cx.lineTo(side*6*s,-30*s);
      cx.quadraticCurveTo(side*10*s,-55*s,side*7*s,-88*s);
      cx.fill();
    });
  }
  cx.restore();
}

function drawEyes(cx2,cy,s,mood,lash){
  [-1,1].forEach(side=>{
    const ex=cx2+side*6*s;
    cx.fillStyle='#fff'; cx.beginPath(); cx.ellipse(ex,cy,3.5*s,3*s,0,0,Math.PI*2); cx.fill();
    cx.fillStyle=mood==='love'?'#c03060':'#1a1030';
    cx.beginPath(); cx.arc(ex+.5*s,cy,.5+1.8*s,0,Math.PI*2); cx.fill();
    cx.fillStyle='#000'; cx.beginPath(); cx.arc(ex+.5*s,cy,1*s,0,Math.PI*2); cx.fill();
    cx.fillStyle='rgba(255,255,255,.7)'; cx.beginPath(); cx.arc(ex+1.2*s,cy-.8*s,.7*s,0,Math.PI*2); cx.fill();
    if(lash){
      cx.strokeStyle='#111'; cx.lineWidth=1.2*s;
      cx.beginPath(); cx.arc(ex,cy,3.5*s,-Math.PI*.8,-Math.PI*.2); cx.stroke();
    }
    if(mood==='love'){
      cx.fillStyle='#ec4899'; drawHeart(ex,cy-5*s,2.5*s);
    }
  });
}

function drawMouth(cx2,cy,s,mood){
  cx.lineCap='round';
  if(mood==='happy'||mood==='love'){
    cx.fillStyle='#d04050';
    cx.beginPath(); cx.arc(cx2,cy-1*s,4*s,.15,Math.PI-.15); cx.fill();
  } else if(mood==='surprise'){
    cx.fillStyle='#c04050';
    cx.beginPath(); cx.ellipse(cx2,cy,2.5*s,3.5*s,0,0,Math.PI*2); cx.fill();
  } else {
    cx.strokeStyle='#804030'; cx.lineWidth=1.3*s;
    cx.beginPath(); cx.arc(cx2,cy,3.5*s,.1,Math.PI-.1); cx.stroke();
  }
}

// ─── BIKE ───
function drawBike(x,y,s,rot){
  cx.save(); cx.translate(x,y);
  cx.strokeStyle='#444'; cx.lineWidth=2.5*s;
  [-1,1].forEach(side=>{
    const wx=side*18*s;
    cx.beginPath(); cx.arc(wx,12*s,13*s,0,Math.PI*2); cx.stroke();
    // Spokes
    cx.lineWidth=.8*s;
    for(let i=0;i<5;i++){
      const a=i*Math.PI/2.5+rot*3;
      cx.beginPath(); cx.moveTo(wx,12*s);
      cx.lineTo(wx+Math.cos(a)*11*s,12*s+Math.sin(a)*11*s); cx.stroke();
    }
    cx.lineWidth=2.5*s;
    cx.fillStyle='#555'; cx.beginPath(); cx.arc(wx,12*s,2.5*s,0,Math.PI*2); cx.fill();
  });
  // Frame
  cx.strokeStyle='#b91c1c'; cx.lineWidth=2.5*s;
  cx.beginPath(); cx.moveTo(-18*s,12*s); cx.lineTo(0,-4*s); cx.lineTo(18*s,12*s);
  cx.moveTo(0,-4*s); cx.lineTo(-8*s,-12*s);
  cx.moveTo(0,-4*s); cx.lineTo(12*s,-4*s); cx.lineTo(18*s,12*s); cx.stroke();
  // Seat
  cx.fillStyle='#222'; cx.beginPath(); cx.ellipse(10*s,-6*s,7*s,2.5*s,-.05,0,Math.PI*2); cx.fill();
  // Handle
  cx.strokeStyle='#333'; cx.lineWidth=2*s;
  cx.beginPath(); cx.moveTo(-12*s,-16*s); cx.lineTo(-8*s,-12*s); cx.lineTo(-4*s,-14*s); cx.stroke();
  cx.restore();
}

// ─── PHOTO POLAROID ───
function drawPhoto(x,y,w,h,rot){
  cx.save(); cx.translate(x,y); cx.rotate(rot);
  cx.shadowColor='rgba(0,0,0,.25)'; cx.shadowBlur=12;
  cx.fillStyle='#f8f8f0'; fillRR(-w/2-6,-h/2-6,w+12,h+22,3);
  cx.shadowBlur=0;
  // Face in photo
  cx.fillStyle='#fce4ec'; cx.fillRect(-w/2,-h/2,w,h);
  cx.fillStyle='#e8b89d'; cx.beginPath(); cx.ellipse(0,-3,w*.22,w*.27,0,0,Math.PI*2); cx.fill();
  cx.fillStyle='#0a0a0a'; cx.beginPath(); cx.ellipse(0,-12,w*.26,w*.2,0,Math.PI,Math.PI*2); cx.fill();
  // tiny smile + eyes
  cx.fillStyle='#1a1030'; cx.beginPath(); cx.arc(-w*.07,-4,2,0,Math.PI*2); cx.fill();
  cx.beginPath(); cx.arc(w*.07,-4,2,0,Math.PI*2); cx.fill();
  cx.strokeStyle='#a04040'; cx.lineWidth=1.2;
  cx.beginPath(); cx.arc(0,2,w*.08,.2,Math.PI-.2); cx.stroke();
  cx.restore();
}

// ─── SCENE BACKGROUNDS ───

function bgLivingRoom(t){
  // Wall
  let g=cx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#1e1040'); g.addColorStop(1,'#120a28');
  cx.fillStyle=g; cx.fillRect(0,0,W,H);
  // Floor
  g=cx.createLinearGradient(0,H*.62,0,H);
  g.addColorStop(0,'#2a1848'); g.addColorStop(1,'#120a28');
  cx.fillStyle=g; cx.fillRect(0,H*.62,W,H*.38);

  // Window
  const wx=W*.68,wy=H*.1,ww=W*.18,wh=H*.28;
  cx.fillStyle='#0c0820'; fillRR(wx,wy,ww,wh,6);
  cx.fillStyle='rgba(200,180,255,.04)'; fillRR(wx+3,wy+3,ww-6,wh-6,4);
  // Moonlight
  g=cx.createRadialGradient(wx+ww/2,wy+wh/2,10,wx+ww/2,wy+wh/2,W*.3);
  g.addColorStop(0,'rgba(200,180,255,.06)'); g.addColorStop(1,'rgba(0,0,0,0)');
  cx.fillStyle=g; cx.fillRect(0,0,W,H);

  // Sofa
  const sx=W*.12,sy=H*.52;
  cx.fillStyle='#4c1d95'; fillRR(sx,sy-8,W*.32,32,10);
  cx.fillStyle='#5b21b6'; fillRR(sx-4,sy+20,W*.33,30,8);
  cx.fillStyle='#6d28d9';
  fillRR(sx+4,sy+22,W*.09,26,6);
  fillRR(sx+W*.1,sy+22,W*.09,26,6);
  fillRR(sx+W*.2,sy+22,W*.09,26,6);
  cx.fillStyle='#3b0f70';
  fillRR(sx-8,sy-4,14,56,6); fillRR(sx+W*.32-6,sy-4,14,56,6);

  // Lamp
  cx.fillStyle='#5b2e8a'; fillRR(W*.5,sy+15,28,35,5);
  cx.fillStyle='#f9a8d4';

  cx.fillStyle='#ddd'; cx.font='600 11px system-ui'; cx.textAlign='left';
  cx.fillText('My Love ❤️',px+36,py+48);
  return {px,py,pw,ph};
}
function chatBubble(ph,text,me,yOff,p2){
  if(p2<=0) return;
  const {px,py,pw}=ph;
  cx.font='12px system-ui';
  const bw=Math.min(pw*.62,cx.measureText(text).width+22);
  const bh=28, bx=me?px+pw-10-bw:px+14, by=py+72+yOff;
  cx.globalAlpha=Math.min(p2*2,1);
  const sc=EIB(Math.min(p2*1.5,1));
  cx.save(); cx.translate(bx+(me?bw:0),by); cx.scale(sc,sc); cx.translate(-(bx+(me?bw:0)),-by);
  cx.fillStyle=me?'#5b21b6':'#1e1040'; fillRR(bx,by,bw,bh,12);
  cx.fillStyle='#eee'; cx.textAlign=me?'right':'left';
  cx.fillText(text,me?bx+bw-12:bx+12,by+18);
  cx.textAlign='left'; cx.restore(); cx.globalAlpha=1;
}

    dress:'#f9a8d4',dress2:'#ec4899'});

  if(Math.random()<.1)
    emitP(bx+Math.random()*50,H*.52,1,{cols:['#e8a030','#f9a8d4','#c084fc','#34d399'],sp:1.8,rise:1.2,sz:2});
  tickParts(); drawParts();
}

// S5: Sunset silhouette couple
function S5(t){
  bgSunset(t);
  // Silhouettes
  const cy=H*.72;
  cx.fillStyle='#050510';

  // Guy silhouette
  cx.save(); cx.translate(W/2-18,cy);
  cx.beginPath(); cx.arc(0,-58,10,0,Math.PI*2); cx.fill(); // head
  fillRR(-10,-48,20,25,4); // body
  fillRR(-8,-5,7,24,2); fillRR(1,-5,7,24,2); // legs
  cx.save(); cx.translate(10,-42); cx.rotate(-.35);
  fillRR(0,0,6,18,2); cx.restore(); // arm reaching
  cx.restore();

  // Girl silhouette
  cx.save(); cx.translate(W/2+18,cy);
  cx.beginPath(); cx.arc(0,-55,9,0,Math.PI*2); cx.fill();
  cx.beginPath(); cx.moveTo(-8,-46); cx.lineTo(-14,-2); cx.lineTo(14,-2); cx.lineTo(8,-46); cx.fill(); // dress
  // Hair
  cx.beginPath(); cx.moveTo(-9,-55); cx.quadraticCurveTo(-12,-38,-8,-25); cx.lineTo(-5,-25);
  cx.quadraticCurveTo(-9,-38,-6,-55); cx.fill();
  cx.beginPath(); cx.moveTo(9,-55); cx.quadraticCurveTo(12,-38,8,-25); cx.lineTo(5,-25);
  cx.quadraticCurveTo(9,-38,6,-55); cx.fill();
  cx.save(); cx.translate(-8,-40); cx.rotate(.35);
  fillRR(-6,0,6,16,2); cx.restore();
  cx.restore();

  // Hand glow
  let g2=cx.createRadialGradient(W/2,cy-28,2,W/2,cy-28,25);
  g2.addColorStop(0,'rgba(249,168,212,.2)'); g2.addColorStop(1,'rgba(0,0,0,0)');
  cx.fillStyle=g2; cx.fillRect(W/2-30,cy-55,60,55);

  if(Math.random()<.08)
    emitP(W/2+(Math.random()-.5)*30,cy-65,1,{shape:'heart',cols:['#ec4899','#f43f5e'],sp:.8,rise:1.5,sz:3});
  tickParts(); drawParts();
}

// S6: Marriage
function S6(t){
  bgMandap(t);
  drawPerson(W/2-30,H*.76,1.15,{kind:'GM',mood:'happy',arm:8,tilt:2});
  drawPerson(W/2+30,H*.76,1.1,{kind:'BF',face:-1,mood:'happy',arm:6,tilt:-2});

  // Garland exchange
  if(t>2.5 && t<5.5){
    const gt=EIB(clamp((t-2.5)/1.5,0,1));
    cx.strokeStyle='#e04020'; cx.lineWidth=2.5;
    cx.beginPath(); cx.arc(W/2+30,H*.76-80+gt*12,12,-.4,Math.PI+.4); cx.stroke();
    cx.fillStyle='#e8a020';
    for(let i=0;i<4;i++){
      const a=-.2+i*.35;
      cx.beginPath(); cx.arc(W/2+30+Math.cos(a)*12,H*.76-80+gt*12+Math.sin(a)*12,2.5,0,Math.PI*2); cx.fill();
    }
  }
  // Rice throwing
  if(t>3.5 && Math.random()<.18)
    emitP(W/2+(Math.random()-.5)*80,H*.55-Math.random()*30,2,
      {cols:['#e8a030','#fff','#fef3c7'],sp:2.5,rise:-.8,sz:1.8});
  // Golden glow
  if(t>4){
    let g2=cx.createRadialGradient(W/2,H*.65,8,W/2,H*.65,120);
    g2.addColorStop(0,'rgba(255,215,0,.1)'); g2.addColorStop(1,'rgba(0,0,0,0)');
    cx.fillStyle=g2; cx.fillRect(0,0,W,H);
  }
  tickParts(); drawParts();
}

// S7: Birthday → Quiz transition
function S7(t){
  let g=cx.createRadialGradient(W/2,H/2,40,W/2,H/2,W*.55);
  g.addColorStop(0,'#200e30'); g.addColorStop(1,'#080612');
  cx.fillStyle=g; cx.fillRect(0,0,W,H);

  // Balloons
  const bCols=['#ec4899','#a855f7','#6366f1','#f43f5e','#e8a020'];
  for(let i=0;i<7;i++){
    const bx=W*.08+i*W*.13, by=H*.12+Math.sin(t*1.2+i)*10;
    cx.fillStyle=bCols[i%5];
    cx.beginPath(); cx.ellipse(bx,by,14,18,0,0,Math.PI*2); cx.fill();
    cx.fillStyle='rgba(255,255,255,.2)';
    cx.beginPath(); cx.ellipse(bx-4,by-5,3,5,-.3,0,Math.PI*2); cx.fill();
    cx.strokeStyle='rgba(255,255,255,.08)'; cx.lineWidth=.8;
    cx.beginPath(); cx.moveTo(bx,by+18);
    cx.quadraticCurveTo(bx+Math.sin(t+i)*4,by+40,bx,by+55); cx.stroke();
  }
  // Banner
  cx.globalAlpha=.7; cx.fillStyle='#5b21b6';
  cx.beginPath(); cx.moveTo(W*.12,H*.3); cx.lineTo(W*.88,H*.3);
  cx.lineTo(W*.86,H*.3+30); cx.lineTo(W*.14,H*.3+30); cx.fill();
  cx.globalAlpha=1;
  cx.fillStyle='#e8a030'; cx.font=`700 ${Math.min(20,W*.035)}px system-ui`;
  cx.textAlign='center'; cx.fillText('🎂 Happy Birthday My Love! 🎂',W/2,H*.3+21);

  drawPerson(W/2,H*.78,1.3,{kind:'M',mood:'happy',arm:-25+Math.sin(t*2.5)*8,tilt:Math.sin(t)*2});

  // Confetti
  if(Math.random()<.2)
    emitP(Math.random()*W,-5,1,{shape:'confetti',
      cols:['#ec4899','#a855f7','#e8a020','#6366f1','#34d399','#f43f5e'],sp:2.5,rise:-1.5,sz:4.5});

  // Text
  if(t>2){
    cx.globalAlpha=EO(clamp((t-2)/.8,0,1));
    cx.fillStyle='#eee'; cx.font=`600 ${Math.min(17,W*.03)}px system-ui`;
    cx.fillText('But first... answer some questions! 😏',W/2,H*.5);
    cx.globalAlpha=1;
  }
  tickParts(); drawParts();
}

const SCENES = [S0,S1,S2,S3,S4,S5,S6,S7];
const DURS =   [10, 10, 9, 11, 9,  8, 9, 5]; // seconds each

// ─── PLAYBACK ENGINE ───
let curScene = -1, sceneStart = 0, playing = false;
let timers = [];

function clearT(){ timers.forEach(clearTimeout); timers=[]; }

function playScene(idx){
  if(idx >= SCENES.length){
    setTimeout(()=>{ document.getElementById('skipBtn').style.display='none'; startQuiz(); }, 400);
    return;
  }
  curScene = idx;
  sceneStart = performance.now();
  parts = [];

  // Schedule next scene
  timers.push(setTimeout(()=> playScene(idx+1), DURS[idx]*1000));
}

function mainLoop(now){
  requestAnimationFrame(mainLoop);
  if(curScene < 0 || curScene >= SCENES.length) return;

  const t = (now - sceneStart) / 1000;
  sceneT = t;
  cx.clearRect(0,0,W,H);

  // Render current scene
  SCENES[curScene](t);

  // Letterbox
  cx.fillStyle='#000';
  cx.fillRect(0,0,W,H*.055);
  cx.fillRect(0,H*.945,W,H*.055);

  // Progress bar
  const total = DURS.reduce((a,b)=>a+b,0);
  let elapsed=0;
  for(let i=0;i<curScene;i++) elapsed+=DURS[i];
  elapsed+=Math.min(t,DURS[curScene]);
  const p2=elapsed/total;
  cx.fillStyle='rgba(255,255,255,.08)';
  fillRR(W*.1,H*.97,W*.8,2.5,1);
  cx.fillStyle='#c060a0';
  fillRR(W*.1,H*.97,W*.8*p2,2.5,1);
}

function begin(){
  document.getElementById('titleScreen').classList.add('gone');
  document.getElementById('skipBtn').style.display='block';
  setTimeout(()=> playScene(0), 800);
}

function skipToQuiz(){
  clearT(); curScene=-1;
  document.getElementById('skipBtn').style.display='none';
  startQuiz();
}

document.getElementById('titleScreen').addEventListener('click', begin);
requestAnimationFrame(mainLoop);

// ─── QUIZ ───
const QS = [
  {q:"When did I approach you?", opts:["Mar 31, 2025","Apr 2, 2025","Apr 4, 2025","Apr 1, 2025"], ans:1,
    wrongs:["Babe, really? 😭 That's not even close!","Were you even there? 🤣","I'm questioning this relationship... 😤"]},
  {q:"When was our First Kiss? 💋", opts:["Aug 13, 2025","Aug 16, 2025","Aug 15, 2025","Aug 14, 2025"], ans:2,
    wrongs:["HOW do you forget THIS?! 💀","I can't believe you right now 😑","That kiss meant NOTHING to you?! 😢"]},
  {q:"When was our First Fight? 😤", opts:["Aug 25, 2025","Aug 28, 2025","Aug 26, 2025","Aug 27, 2025"], ans:2,
    wrongs:["Oh so fights don't matter to you? 😏","Selective memory much? 🙄","Even Google remembers better than you!"]},
  {q:"Our Home Engagement happened on?", opts:["Aug 26, 2025","Aug 29, 2025","Aug 27, 2025","Aug 28, 2025"], ans:2,
    wrongs:["THE RING IS RIGHT THERE ON YOUR FINGER 💍😤","Should I return the ring? 🤔","I'm calling your mom right now! 📞"]},
  {q:"Our First Movie together? 🎬", opts:["Sep 20, 2025","Sep 22, 2025","Sep 21, 2025","Sep 19, 2025"], ans:2,
    wrongs:["Not the popcorn memories! 🍿😭","I still have the ticket stub... do you? 🎫","Wow, the disrespect is REAL 💔"]}
];
let qi=0, sc=0, answered=false;

function startQuiz(){
  cv.style.display='none';
  document.getElementById('quizUI').style.display='block';
  qi=0; sc=0; loadQ();
}

function loadQ(){
  answered=false;
  const q=QS[qi], el=document.getElementById('quizUI');
  el.innerHTML=`<div class="qWrap">
    <div class="qHead">QUESTION ${qi+1} OF ${QS.length} · SCORE ${sc}/${qi}</div>
    <div class="qText">${q.q}</div>
    <div class="qOpts">${q.opts.map((o,i)=>`<div class="qOpt" onclick="pick(${i})">${o}</div>`).join('')}</div>
  </div>`;
}

window.pick = function(i){
  if(answered) return;
  answered=true;
  const q=QS[qi], opts=document.querySelectorAll('.qOpt');
  if(i===q.ans){
    opts[i].classList.add('right'); opts[i].textContent+=' ✅'; sc++;
    setTimeout(()=>{ qi++; qi<QS.length?loadQ():endQuiz(); },1100);
  } else {
    opts[i].classList.add('wrong'); opts[q.ans].classList.add('right');
    showPop(q.wrongs[~~(Math.random()*q.wrongs.length)],false);
  }
};

function showPop(msg,end){
  const el=document.getElementById('quizUI');
  const d=document.createElement('div'); d.className='popup';
  const isWin = end && sc===QS.length;
  d.innerHTML=`<div class="popBox">
    <h3>${end?(isWin?'🎉 Perfect!':'😅 Oops!'):'❌ Wrong!'}</h3>
    <p>${msg}</p>
    <button onclick="this.closest('.popup').remove();${end?(isWin?'showGift()':'retryQ()'):'nextQ()'}">
    ${end?(isWin?'Claim Your Gift! 🎁':'Try Again 💪'):'Next →'}</button>
  </div>`;
  el.appendChild(d);
}

window.nextQ = function(){ qi++; qi<QS.length?loadQ():endQuiz(); };
window.retryQ = function(){ qi=0; sc=0; loadQ(); };

function endQuiz(){
  if(sc===QS.length){
    showPop("You really DO remember everything! 🥹💕 You've earned your gift!",true);
  } else {
    const msgs=[
      `${sc}/${QS.length}?! My goldfish remembers better! 🐠`,
      `${sc}/${QS.length}... I'm not angry, just disappointed 😤`,
      `Only ${sc}/${QS.length}?! We need couples therapy! 💊`,
      `${sc}/${QS.length}... Even autocorrect does better! 📱`
    ];
    showPop(msgs[~~(Math.random()*msgs.length)],true);
  }
}

// ─── GIFT REVEAL ───
window.showGift = function(){
  document.getElementById('quizUI').style.display='none';
  const el=document.getElementById('giftUI');
  el.style.display='flex';
  el.innerHTML=`<h2>Your Gift Is Here!</h2>
    <canvas id="tc" width="220" height="220" style="margin:10px 0"></canvas>
    <div class="gMsg">A Big Teddy Bear! 🧸<br><span style="font-size:14px;color:#a78bfa">
    Because you deserve all the cuddles in the world 💕</span></div>`;
  drawTeddy();
  confettiBurst(el);
};

function drawTeddy(){
  const c2=document.getElementById('tc'); if(!c2) return;
  const t=c2.getContext('2d');
  const cx2=110,cy2=110;
  // Body
  t.fillStyle='#8B6914'; t.beginPath(); t.ellipse(cx2,cy2+25,45,50,0,0,Math.PI*2); t.fill();
  t.fillStyle='#C4A24E'; t.beginPath(); t.ellipse(cx2,cy2+30,28,32,0,0,Math.PI*2); t.fill();
  // Head
  t.fillStyle='#8B6914'; t.beginPath(); t.ellipse(cx2,cx2-30,36,34,0,0,Math.PI*2); t.fill();
  t.fillStyle='#C4A24E'; t.beginPath(); t.ellipse(cx2,cx2-23,22,19,0,0,Math.PI*2); t.fill();
  // Ears
  [[-30,-50],[30,-50]].forEach(([ex,ey])=>{
    t.fillStyle='#8B6914'; t.beginPath(); t.arc(cx2+ex,cx2+ey,13,0,Math.PI*2); t.fill();
    t.fillStyle='#C4A24E'; t.beginPath(); t.arc(cx2+ex,cx2+ey,7,0,Math.PI*2); t.fill();
  });
  // Eyes
  [[-12,-35],[12,-35]].forEach(([ex,ey])=>{
    t.fillStyle='#1a1030'; t.beginPath(); t.arc(cx2+ex,cx2+ey,4.5,0,Math.PI*2); t.fill();
    t.fillStyle='#fff'; t.beginPath(); t.arc(cx2+ex+1.5,cx2+ey-1.5,1.8,0,Math.PI*2); t.fill();
  });
  // Nose
  t.fillStyle='#222'; t.beginPath(); t.ellipse(cx2,cx2-22,5,3.5,0,0,Math.PI*2); t.fill();
  t.strokeStyle='#333'; t.lineWidth=1.5;
  t.beginPath(); t.arc(cx2,cx2-18,6,.2,Math.PI-.2); t.stroke();
  // Arms
  t.fillStyle='#8B6914';
  t.beginPath(); t.ellipse(cx2-42,cx2+10,13,25,.3,0,Math.PI*2); t.fill();
  t.beginPath(); t.ellipse(cx2+42,cx2+10,13,25,-.3,0,Math.PI*2); t.fill();
  // Legs
  t.beginPath(); t.ellipse(cx2-20,cy2+70,16,12,.2,0,Math.PI*2); t.fill();
  t.beginPath(); t.ellipse(cx2+20,cy2+70,16,12,-.2,0,Math.PI*2); t.fill();
  t.fillStyle='#C4A24E';
  t.beginPath(); t.ellipse(cx2-20,cy2+72,9,7,.2,0,Math.PI*2); t.fill();
  t.beginPath(); t.ellipse(cx2+20,cy2+72,9,7,-.2,0,Math.PI*2); t.fill();
  // Bow
  t.fillStyle='#ec4899';
  t.beginPath(); t.moveTo(cx2,cx2-5); t.lineTo(cx2-13,cx2-14); t.lineTo(cx2-13,cx2+4); t.fill();
  t.beginPath(); t.moveTo(cx2,cx2-5); t.lineTo(cx2+13,cx2-14); t.lineTo(cx2+13,cx2+4); t.fill();
  t.fillStyle='#f43f5e'; t.beginPath(); t.arc(cx2,cx2-5,3.5,0,Math.PI*2); t.fill();
  // Heart on belly
  t.fillStyle='#ec4899'; t.save(); t.translate(cx2,cy2+28);
  t.beginPath(); t.moveTo(0,-2);
  t.bezierCurveTo(-5,-8,-10,0,0,7); t.bezierCurveTo(10,0,5,-8,0,-2); t.fill();
  t.restore();
}

function confettiBurst(parent){
  const cc=document.createElement('canvas');
  cc.style.cssText='position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none';
  cc.width=W*dpr; cc.height=H*dpr; parent.appendChild(cc);
  const c2=cc.getContext('2d'); c2.setTransform(dpr,0,0,dpr,0,0);
  const cols=['#ec4899','#a855f7','#e8a020','#6366f1','#34d399','#f43f5e','#3b82f6'];
  const ps=[];
  for(let i=0;i<120;i++) ps.push({
    x:Math.random()*W, y:-Math.random()*H*.5,
    vx:(Math.random()-.5)*3.5, vy:1+Math.random()*2.5,
    sz:3+Math.random()*5, col:cols[~~(Math.random()*cols.length)],
    rot:Math.random()*6.28, rv:(Math.random()-.5)*.12
  });
  (function anim(){
    c2.clearRect(0,0,W,H); let alive=false;
    ps.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy; p.vy+=.025; p.rot+=p.rv;
      if(p.y<H+15) alive=true;
      c2.save(); c2.translate(p.x,p.y); c2.rotate(p.rot);
      c2.fillStyle=p.col; c2.fillRect(-p.sz/2,-p.sz/2,p.sz,p.sz*1.4);
      c2.restore();
    });
    if(alive) requestAnimationFrame(anim);
  })();
}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Love Story</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:system-ui,-apple-system,sans-serif}
canvas{display:block;position:fixed;top:0;left:0;width:100vw;height:100vh}

#titleScreen{position:fixed;top:0;left:0;width:100%;height:100%;z-index:20;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 40%,#1e1040,#0a0612);cursor:pointer;
  transition:opacity 1.5s ease}
#titleScreen.gone{opacity:0;pointer-events:none}
#titleScreen h1{font-size:clamp(28px,7vw,52px);font-weight:300;letter-spacing:2px;
  background:linear-gradient(135deg,#f9a8d4,#c084fc,#f9a8d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  opacity:0;animation:fadeIn 2.5s ease .3s forwards}
#titleScreen p{color:rgba(255,255,255,.3);margin-top:12px;font-size:14px;letter-spacing:4px;
  opacity:0;animation:fadeIn 2s ease 2s forwards}
@keyframes fadeIn{to{opacity:1}}

#skipBtn{position:fixed;top:16px;right:16px;z-index:30;background:rgba(0,0,0,.5);
  border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.6);padding:8px 18px;
  border-radius:20px;font-size:12px;cursor:pointer;display:none;letter-spacing:1px}
#skipBtn:hover{background:rgba(255,255,255,.1)}

/* QUIZ */
#quizUI{position:fixed;top:0;left:0;width:100%;height:100%;z-index:25;display:none;overflow:hidden}
.quizBg{position:absolute;top:0;left:0;width:100%;height:100%;
  background:linear-gradient(135deg,#1a0a2e,#2d0a1e,#1a0a2e);
  background-size:400% 400%;animation:gradShift 8s ease infinite}
@keyframes gradShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.quizBg::before{content:'';position:absolute;top:0;left:0;width:100%;height:100%;
  background:radial-gradient(circle at 20% 80%,rgba(236,72,153,.08),transparent 50%),
  radial-gradient(circle at 80% 20%,rgba(168,85,247,.08),transparent 50%)}
.qWrap{position:relative;z-index:2;max-width:460px;margin:0 auto;padding:30px 20px;height:100%;
  display:flex;flex-direction:column;justify-content:center}
.qHead{text-align:center;color:rgba(255,255,255,.35);font-size:13px;letter-spacing:2px;margin-bottom:24px}
.qText{font-size:clamp(18px,4.5vw,22px);color:#f0e6ff;text-align:center;margin-bottom:32px;font-weight:600;line-height:1.5}
.qOpts{display:flex;flex-direction:column;gap:10px}
.qOpt{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
  color:#d4c4f0;padding:14px 20px;border-radius:12px;font-size:15px;cursor:pointer;
  transition:all .25s;text-align:center}
.qOpt:hover{background:rgba(168,85,247,.12);border-color:rgba(168,85,247,.3);transform:translateY(-1px)}
.qOpt.right{background:rgba(16,185,129,.2)!important;border-color:#10b981!important;color:#6ee7b7!important;pointer-events:none}
.qOpt.wrong{background:rgba(239,68,68,.15)!important;border-color:#ef4444!important;color:#fca5a5!important;animation:shake .4s;pointer-events:none}
.qOpt.dead{opacity:.35;pointer-events:none}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.lifeBar{text-align:center;margin-bottom:16px;font-size:14px;color:#f9a8d4;letter-spacing:1px}

/* Fullscreen overlays */
.fullOverlay{position:fixed;top:0;left:0;width:100%;height:100%;z-index:40;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:opacity .8s ease}
.fullOverlay.fadeOut{opacity:0}

/* "You Lost" screen — cinematic dark with animated glitch */
.lostScreen{background:#000;overflow:hidden}
.lostScreen::before{content:'';position:absolute;top:0;left:0;width:100%;height:100%;
  background:radial-gradient(circle at 50% 50%,rgba(239,68,68,.06) 0%,transparent 70%);
  animation:lostPulse 1.5s ease-in-out infinite}
@keyframes lostPulse{0%,100%{opacity:.3}50%{opacity:1}}
.lostScreen h2{font-size:clamp(40px,10vw,72px);font-weight:900;letter-spacing:8px;
  color:transparent;background:linear-gradient(180deg,#ef4444,#7f1d1d);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  text-shadow:0 0 80px rgba(239,68,68,.4);margin-bottom:24px;position:relative;
  animation:glitchIn .6s ease forwards}
@keyframes glitchIn{0%{transform:scale(3);opacity:0;filter:blur(20px)}
  60%{transform:scale(.95);opacity:1;filter:blur(0)}100%{transform:scale(1)}}
.lostScreen p{color:rgba(255,255,255,.3);font-size:16px;max-width:300px;text-align:center;
  line-height:1.6;font-weight:300;letter-spacing:2px;animation:fadeIn 1.5s ease .5s forwards;opacity:0}

/* "Eternal Lives" — premium light reveal with glass */
.lightReveal{background:#fff;transition:background 2.5s ease}
.lightReveal.dim{background:linear-gradient(135deg,#fdf2f8,#f5d0fe,#fce7f3,#ede9fe)}
.lightReveal .revealCard{background:rgba(255,255,255,.5);backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.6);border-radius:28px;padding:40px 32px;max-width:400px;
  width:90%;text-align:center;box-shadow:0 20px 60px rgba(168,85,247,.1);
  opacity:0;transform:translateY(30px);transition:all 1.2s cubic-bezier(.22,1,.36,1) .6s}
.lightReveal.dim .revealCard{opacity:1;transform:translateY(0)}
.lightReveal .revealCard h2{font-size:clamp(18px,4.5vw,26px);color:#6d28d9;font-weight:600;
  line-height:1.6;margin-bottom:16px}
.lightReveal .revealCard .inf{font-size:64px;margin:16px 0;
  animation:infPulse 2s ease-in-out infinite}
@keyframes infPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.lightReveal .revealCard p{color:#7c3aed;font-size:15px;line-height:1.7;margin-bottom:20px}
.lightReveal .revealCard button{background:linear-gradient(135deg,#7c3aed,#a855f7);border:none;
  color:#fff;padding:14px 36px;border-radius:50px;font-size:15px;cursor:pointer;font-weight:600;
  letter-spacing:.5px;box-shadow:0 4px 20px rgba(124,58,237,.25);transition:transform .2s}
.lightReveal .revealCard button:hover{transform:scale(1.04)}

/* GIFT — cinematic full-screen experience */
#giftUI{position:fixed;top:0;left:0;width:100%;height:100%;z-index:26;display:none;
  flex-direction:column;align-items:center;overflow-y:auto;overflow-x:hidden;
  background:#040008}
#giftBg{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}
.giftInner{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;
  padding:24px 20px 60px;width:100%;max-width:460px;min-height:100vh}

/* Stagger animations */
.g-anim{opacity:0;transform:translateY(24px);animation:gSlideUp .9s cubic-bezier(.22,1,.36,1) forwards}
@keyframes gSlideUp{to{opacity:1;transform:translateY(0)}}
.g-d1{animation-delay:.1s}.g-d2{animation-delay:.3s}.g-d3{animation-delay:.5s}
.g-d4{animation-delay:.8s}.g-d5{animation-delay:1.1s}

/* Score header */
.scoreHeader{width:100%;text-align:center;padding:16px 0 12px}
.scoreHeader .grade{font-size:clamp(11px,3vw,13px);text-transform:uppercase;letter-spacing:4px;
  font-weight:600;margin-bottom:8px}
.scoreHeader .starsRow{font-size:clamp(28px,7vw,40px);letter-spacing:6px;margin-bottom:4px}
.scoreHeader .gradeTitle{font-size:clamp(22px,6vw,32px);font-weight:700;letter-spacing:1px}

/* Stats strip */
.statsStrip{width:100%;display:flex;gap:8px;margin:16px 0}
.statPill{flex:1;text-align:center;padding:16px 8px;
  background:rgba(255,255,255,.03);backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.06);border-radius:16px;
  position:relative;overflow:hidden}
.statPill::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent)}
.statPill .num{font-size:clamp(22px,5.5vw,28px);font-weight:700;color:#f9a8d4;display:block;
  line-height:1}
.statPill .tag{font-size:10px;color:rgba(255,255,255,.3);text-transform:uppercase;
  letter-spacing:2px;margin-top:6px;display:block}
.funnyQuote{text-align:center;color:rgba(255,255,255,.3);font-size:13px;font-style:italic;
  margin:4px 0 20px;letter-spacing:.3px}

/* Divider */
.gDivider{width:50px;height:1px;background:linear-gradient(90deg,transparent,rgba(249,168,212,.3),transparent);
  margin:8px 0 20px}

/* Gift reveal */
.giftRevealSection{display:flex;flex-direction:column;align-items:center;width:100%}
.giftLabel{font-size:11px;color:rgba(255,255,255,.25);text-transform:uppercase;letter-spacing:5px;
  margin-bottom:16px}

/* Teddy container with glow */
.teddyGlow{position:relative;display:flex;align-items:center;justify-content:center}
.teddyGlow::before{content:'';position:absolute;width:280px;height:280px;border-radius:50%;
  background:radial-gradient(circle,rgba(236,72,153,.1),rgba(168,85,247,.05),transparent 70%);
  animation:glowPulse 4s ease-in-out infinite}
@keyframes glowPulse{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(1.15);opacity:1}}
.teddyGlow canvas{position:relative;z-index:1;animation:teddyFloat 4s ease-in-out infinite}
@keyframes teddyFloat{0%,100%{transform:translateY(0) rotate(0deg)}
  25%{transform:translateY(-8px) rotate(.5deg)}
  75%{transform:translateY(-4px) rotate(-.5deg)}}

/* Gift message card */
.giftCard{width:100%;margin-top:24px;padding:24px;text-align:center;
  background:rgba(255,255,255,.03);backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.06);border-radius:20px;position:relative;overflow:hidden}
.giftCard::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(249,168,212,.15),transparent)}
.giftCard .gTitle{font-size:clamp(20px,5vw,26px);font-weight:300;letter-spacing:1px;
  background:linear-gradient(135deg,#f9a8d4,#c084fc,#f9a8d4);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
.giftCard .gDesc{color:rgba(255,255,255,.45);font-size:14px;line-height:1.7;font-weight:300}
.giftCard .gHeart{font-size:20px;margin-top:12px;display:inline-block;
  animation:heartBeat 1.5s ease-in-out infinite}
@keyframes heartBeat{0%,100%{transform:scale(1)}15%{transform:scale(1.15)}30%{transform:scale(1)}
  45%{transform:scale(1.1)}60%{transform:scale(1)}}

/* Footer love note */
.loveNote{margin-top:28px;text-align:center;padding:0 20px}
.loveNote p{color:rgba(255,255,255,.2);font-size:12px;line-height:1.8;font-weight:300;letter-spacing:.5px}
.loveNote .sig{color:#f9a8d4;font-size:14px;margin-top:8px;font-weight:400}

/* ═══ POST-QUIZ INTERACTIVE PAGES ═══ */
@import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;600;700&display=swap');

.postPage{position:fixed;top:0;left:0;width:100%;height:100%;z-index:27;display:none;
  flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.postPage.show{display:flex}

/* ── EXCITED PAGE ── */
#excitedUI{background:linear-gradient(135deg,#1a0a2e,#2d0a1e,#1a0a2e);
  background-size:400% 400%;animation:gradShift 8s ease infinite}
.excitedWrap{z-index:2;text-align:center;max-width:400px;padding:20px}
.excitedEmoji{font-size:60px;margin-bottom:16px;animation:bounce 1s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}
.excitedTitle{font-family:'Dancing Script',cursive;font-size:clamp(28px,7vw,40px);
  color:#f9a8d4;font-weight:700;margin-bottom:8px}
.excitedSub{color:rgba(255,255,255,.5);font-size:15px;margin-bottom:36px;letter-spacing:1px}
.excitedBtns{display:flex;gap:20px;justify-content:center;align-items:center;position:relative;min-height:60px}
.yesBtn{background:linear-gradient(135deg,#ec4899,#a855f7);border:none;color:#fff;
  padding:16px 48px;border-radius:50px;font-size:18px;cursor:pointer;font-weight:700;
  letter-spacing:1px;box-shadow:0 4px 24px rgba(236,72,153,.4);transition:all .3s}
.yesBtn:hover{transform:scale(1.08);box-shadow:0 6px 30px rgba(236,72,153,.5)}
.noBtn{background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.15);color:rgba(255,255,255,.6);
  padding:14px 36px;border-radius:50px;font-size:16px;cursor:pointer;font-weight:600;
  transition:all .15s;position:absolute}

/* ── BALLOON PAGE ── */
#balloonUI{background:linear-gradient(180deg,#e8f5e9,#f3e5f5,#fce4ec)}
.balloonTitle{font-family:'Dancing Script',cursive;font-size:clamp(26px,6.5vw,38px);
  color:#7b1fa2;font-weight:700;z-index:2;margin-bottom:4px;
  opacity:0;animation:fadeIn 1s ease .3s forwards}
.balloonSub{color:rgba(100,50,100,.5);font-size:14px;letter-spacing:2px;z-index:2;margin-bottom:20px;
  opacity:0;animation:fadeIn 1s ease .6s forwards}
.balloonArea{position:relative;z-index:2;width:90%;max-width:400px;height:55vh;min-height:300px}
.balloon{position:absolute;cursor:pointer;transition:transform .2s;animation:balloonFloat 3s ease-in-out infinite}
.balloon:hover{transform:scale(1.1)!important}
@keyframes balloonFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.balloon svg{filter:drop-shadow(0 4px 8px rgba(0,0,0,.12))}
.popEffect{position:absolute;pointer-events:none;z-index:10}
.popPiece{position:absolute;border-radius:50%;animation:popFly .6s ease-out forwards}
@keyframes popFly{0%{opacity:1;transform:translate(0,0) scale(1)}
  100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(0)}}
.balloonCounter{z-index:2;color:#7b1fa2;font-size:16px;font-weight:600;margin-top:12px;
  opacity:0;animation:fadeIn 1s ease .9s forwards}

/* ── CAKE PAGE ── */
#cakeUI{background:linear-gradient(180deg,#0a0020,#1a0a35,#0d0618)}
#cakeUI::before{content:'';position:absolute;width:100%;height:100%;
  background:radial-gradient(2px 2px at 20% 30%,#fff,transparent),
  radial-gradient(2px 2px at 40% 70%,#e0c3fc,transparent),
  radial-gradient(1px 1px at 60% 20%,#f9a8d4,transparent),
  radial-gradient(1px 1px at 80% 60%,#fff,transparent),
  radial-gradient(2px 2px at 10% 80%,#c084fc,transparent),
  radial-gradient(1px 1px at 70% 40%,#fcd34d,transparent),
  radial-gradient(1px 1px at 90% 10%,#f9a8d4,transparent),
  radial-gradient(2px 2px at 50% 90%,#e0c3fc,transparent);
  animation:twinkle 4s ease-in-out infinite alternate}
@keyframes twinkle{0%{opacity:.4}100%{opacity:1}}
.cakeTitle{color:#fcd34d;font-family:'Dancing Script',cursive;font-size:clamp(28px,7vw,42px);
  font-weight:700;margin-bottom:8px;z-index:2;text-shadow:0 0 30px rgba(252,211,77,.3);
  opacity:0;animation:fadeIn 1.5s ease .3s forwards}
.cakeSubtitle{color:rgba(255,255,255,.4);font-size:13px;letter-spacing:3px;z-index:2;
  opacity:0;animation:fadeIn 1.5s ease .8s forwards;margin-bottom:20px}
.cakeWrap{position:relative;z-index:2;width:280px;height:280px;margin:10px 0 24px}
.cakeCanvas{width:100%;height:100%}
.blowBtn{z-index:2;background:linear-gradient(135deg,#7c3aed,#a855f7);border:none;color:#fff;
  padding:16px 40px;border-radius:50px;font-size:16px;cursor:pointer;font-weight:600;
  letter-spacing:1px;box-shadow:0 4px 24px rgba(124,58,237,.4);transition:all .3s;
  opacity:0;animation:fadeIn 1s ease 1.5s forwards}
.blowBtn:hover{transform:scale(1.05);box-shadow:0 6px 30px rgba(124,58,237,.5)}
.blowBtn.blown{background:linear-gradient(135deg,#10b981,#34d399);pointer-events:none}

/* ── ROSE BOUQUET PAGE ── */
#roseUI{background:linear-gradient(180deg,#f5e6ea,#f0c4d0,#f5d5de)}
.roseTitle{font-family:'Dancing Script',cursive;font-size:clamp(26px,6.5vw,36px);color:#c2185b;
  font-weight:700;z-index:2;margin-bottom:4px;opacity:0;animation:fadeIn 1s ease .3s forwards}
.roseEmoji{font-size:28px;z-index:2;opacity:0;animation:fadeIn 1s ease .5s forwards}
.roseBouquet{position:relative;z-index:2;width:92%;max-width:400px;height:50vh;min-height:340px;margin:12px 0}
.loveBubble{position:absolute;padding:10px 16px;background:rgba(255,255,255,.9);
  border-radius:20px;font-size:12px;color:#880e4f;box-shadow:0 4px 16px rgba(233,30,99,.12);
  opacity:0;animation:bubbleIn .8s ease forwards;z-index:3;max-width:140px;text-align:center;line-height:1.4}
@keyframes bubbleIn{0%{opacity:0;transform:scale(.7) translateY(10px)}
  100%{opacity:1;transform:scale(1) translateY(0)}}
.lb1{top:2%;left:2%;animation-delay:.5s}.lb2{top:2%;right:2%;animation-delay:.8s}
.lb3{top:42%;left:-3%;animation-delay:1.1s}.lb4{top:42%;right:-3%;animation-delay:1.4s}
.lb5{bottom:8%;left:5%;animation-delay:1.7s}.lb6{bottom:8%;right:5%;animation-delay:2s}
.heartTree{position:absolute;bottom:0;z-index:1;width:80px;height:150px}
.heartTree.left{left:2%}.heartTree.right{right:2%}
.roseContinue{z-index:3;margin-top:8px;background:linear-gradient(135deg,#ec4899,#f43f5e);
  border:none;color:#fff;padding:14px 36px;border-radius:50px;font-size:15px;cursor:pointer;
  font-weight:600;box-shadow:0 4px 20px rgba(236,72,153,.3);
  opacity:0;animation:fadeIn 1s ease 2.5s forwards;transition:transform .2s}
.roseContinue:hover{transform:scale(1.04)}

/* ── LOVE LETTER PAGE (Envelope) ── */
#letterUI{background:linear-gradient(180deg,#1a0a2e,#2d1040,#1a0a2e)}
.letterTitle{font-family:'Dancing Script',cursive;font-size:clamp(24px,6vw,34px);color:#f472b6;
  font-weight:700;z-index:2;margin-bottom:4px;opacity:0;animation:fadeIn 1.2s ease .3s forwards}
.letterHeart{font-size:22px;z-index:2;margin-bottom:16px;opacity:0;animation:fadeIn 1s ease .6s forwards}
.envelopeWrap{z-index:2;perspective:1000px;cursor:pointer;margin:10px 0 20px;
  opacity:0;animation:fadeIn 1.2s ease .8s forwards}
.envelope{width:min(320px,85vw);height:220px;position:relative;margin:0 auto}
.envBody{position:absolute;bottom:0;width:100%;height:170px;
  background:linear-gradient(175deg,#f7ead4,#f0ddc2,#e8d0ae);border-radius:0 0 10px 10px;
  box-shadow:0 10px 40px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.3);z-index:2}
.envBody::before{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:80%;height:40%;border:1px solid rgba(180,160,130,.15);border-radius:4px}
.envBody::after{content:'To: My Love';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  font-family:'Dancing Script',cursive;font-size:18px;color:rgba(120,90,50,.35);letter-spacing:1px}
.envFlap{position:absolute;top:0;left:0;width:0;height:0;
  border-left:calc(min(320px,85vw)/2) solid transparent;border-right:calc(min(320px,85vw)/2) solid transparent;
  border-top:120px solid #e8d4b8;z-index:3;transform-origin:top center;
  transition:transform 1s cubic-bezier(.4,0,.2,1);
  filter:drop-shadow(0 3px 6px rgba(0,0,0,.12))}
.envFlap.open{transform:rotateX(180deg)}
.envFlapInner{position:absolute;top:0;left:0;width:0;height:0;
  border-left:calc(min(320px,85vw)/2) solid transparent;border-right:calc(min(320px,85vw)/2) solid transparent;
  border-top:120px solid #dcc8ac;z-index:1}
.envSeal{position:absolute;top:80px;left:50%;transform:translateX(-50%);z-index:4;
  width:54px;height:54px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#f06292,#e91e63,#c2185b,#ad1457);
  display:flex;align-items:center;justify-content:center;font-size:26px;
  box-shadow:0 4px 16px rgba(233,30,99,.5),inset 0 -2px 4px rgba(0,0,0,.2),inset 0 2px 4px rgba(255,255,255,.15);
  transition:all .6s cubic-bezier(.4,0,.2,1)}
.envSeal.broken{opacity:0;transform:translateX(-50%) scale(2.5) rotate(20deg)}
.envLabel{text-align:center;color:rgba(255,255,255,.4);font-size:14px;letter-spacing:3px;
  margin-top:16px;opacity:0;animation:fadeIn 1s ease 1.5s forwards;
  font-family:'Dancing Script',cursive}
.letterCard{z-index:5;width:280px;max-width:90%;background:linear-gradient(175deg,#fefce8,#fffbeb,#fef3c7);
  border-radius:12px;padding:24px 20px;box-shadow:0 12px 40px rgba(0,0,0,.3);
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) translateY(80px);
  opacity:0;transition:all 1s cubic-bezier(.22,1,.36,1);pointer-events:none}
.letterCard.visible{opacity:1;transform:translate(-50%,-50%) translateY(0);pointer-events:auto}
.letterCard::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;
  background:repeating-linear-gradient(transparent,transparent 27px,rgba(200,180,160,.2) 27px,rgba(200,180,160,.2) 28px);
  pointer-events:none;border-radius:12px}

<script>
const cv=document.getElementById('c'),cx=cv.getContext('2d');
let W,H,dpr;
function resize(){
  dpr=Math.min(devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;
  cv.width=W*dpr;cv.height=H*dpr;
  cx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener('resize',resize);resize();

const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
const EI=t=>t<.5?2*t*t:-1+(4-2*t)*t;
const EO=t=>t*(2-t);
const EIB=t=>{const s=1.5;return 1+(--t)*t*((s+1)*t+s)};
const prog=(e,s,d)=>clamp((e-s)/d,0,1);

// ─── MUSIC (Web Audio API) ───
let audioCtx=null,bdayPlaying=false,romanticPlaying=false,romanticGain=null,romanticTimer=null;
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();}

function playRomanticMelody(){
  if(romanticPlaying)return;romanticPlaying=true;
  initAudio();
  const master=audioCtx.createGain();master.gain.value=0;master.connect(audioCtx.destination);
  master.gain.linearRampToValueAtTime(.13,audioCtx.currentTime+1.5);
  romanticGain=master;
  const n=(f,s,d,v)=>{
    if(!f)return;
    const o=audioCtx.createOscillator();o.type='sine';o.frequency.value=f;
    const g=audioCtx.createGain();g.gain.setValueAtTime(.001,s);
    g.gain.linearRampToValueAtTime(v*.5,s+d*.12);
    g.gain.setValueAtTime(v*.5,s+d*.6);
    g.gain.exponentialRampToValueAtTime(.001,s+d*.97);
    o.connect(g);g.connect(master);o.start(s);o.stop(s+d);
    const o2=audioCtx.createOscillator();o2.type='triangle';o2.frequency.value=f*2;
    const g2=audioCtx.createGain();g2.gain.setValueAtTime(.001,s);
    g2.gain.linearRampToValueAtTime(v*.08,s+d*.15);
    g2.gain.exponentialRampToValueAtTime(.001,s+d*.8);
    o2.connect(g2);g2.connect(master);o2.start(s);o2.stop(s+d);
  };
  function loop(){
    const C=261.63,D=293.66,E=329.63,F=349.23,G=392,A=440,B=493.88,C5=523.25,D5=587.33,E5=659.25,F5=698.46,G5=783.99;
    let t=audioCtx.currentTime+.2;const b=.52;
    const mel=[[E,b*2],[G,b*1.8],[A,b*1.5],[G,b*2.5],[0,b],[C5,b*2],[D5,b*1.5],[E5,b*2.5],[D5,b*1.2],[C5,b*1.5],[E5,b*3],[0,b*.8],
      [G5,b*2],[F5,b*1.2],[E5,b*2],[D5,b*1],[E5,b*1.5],[G5,b*3.5],[0,b],[F5,b*1.5],[E5,b*1.2],[D5,b*1.5],[C5,b*2],[A,b*3],[0,b],
      [E5,b*1.5],[F5,b*2],[E5,b*1.2],[D5,b*1.5],[C5,b*1],[E5,b*3.5],[0,b],[D5,b*1.5],[C5,b*1.2],[A,b*1.8],[G,b*1.5],[E,b*4],[0,b*2]];
    mel.forEach(([f,d])=>{if(f)n(f,t,d,.5);t+=d;});
    const dur=(t-audioCtx.currentTime)*1000;
    romanticTimer=setTimeout(()=>{if(romanticPlaying)loop();},dur-500);
  }
  loop();
}

function stopRomanticMelody(){
  if(!romanticPlaying)return;
  romanticPlaying=false;
  if(romanticTimer){clearTimeout(romanticTimer);romanticTimer=null;}
  if(romanticGain){romanticGain.gain.linearRampToValueAtTime(0,audioCtx.currentTime+1.5);romanticGain=null;}
}

function playBdayTune(){
  if(bdayPlaying)return;bdayPlaying=true;
  initAudio();
  // Happy Birthday — one octave higher, bright & celebratory
  const C5=523.25,D5=587.33,E5=659.25,F5=698.46,G5=783.99,A5=880,Bb5=932.33,C6=1046.50;
  const melody=[
    {f:C5,d:.22},{f:C5,d:.13},{f:D5,d:.45},{f:C5,d:.45},{f:F5,d:.45},{f:E5,d:.85},
    {f:C5,d:.22},{f:C5,d:.13},{f:D5,d:.45},{f:C5,d:.45},{f:G5,d:.45},{f:F5,d:.85},
    {f:C5,d:.22},{f:C5,d:.13},{f:C6,d:.45},{f:A5,d:.45},{f:F5,d:.35},{f:E5,d:.35},{f:D5,d:.75},
    {f:Bb5,d:.22},{f:Bb5,d:.13},{f:A5,d:.45},{f:F5,d:.45},{f:G5,d:.45},{f:F5,d:.85}
  ];
  // Bass chord progression underneath
  const chords=[[174.61,261.63,349.23],[130.81,196,261.63],[174.61,261.63,349.23],[130.81,196,261.63]];
  const gain=audioCtx.createGain();gain.gain.value=0;gain.connect(audioCtx.destination);
  gain.gain.linearRampToValueAtTime(.18,audioCtx.currentTime+.2);

  let time=audioCtx.currentTime+.1;
  let phraseIdx=0,noteInPhrase=0;
  const phraseLens=[6,6,7,6];
  melody.forEach(n=>{
    // Bright bell/celesta tone (square wave filtered)
    const osc=audioCtx.createOscillator();osc.type='square';osc.frequency.value=n.f;
    const filt=audioCtx.createBiquadFilter();filt.type='lowpass';filt.frequency.value=n.f*4;filt.Q.value=.5;
    const ng=audioCtx.createGain();
    ng.gain.setValueAtTime(.35,time);
    ng.gain.exponentialRampToValueAtTime(.01,time+n.d*.85);
    osc.connect(filt);filt.connect(ng);ng.connect(gain);
    osc.start(time);osc.stop(time+n.d);

    // High sparkle (sine 2 octaves up)
    const o2=audioCtx.createOscillator();o2.type='sine';o2.frequency.value=n.f*4;
    const n2=audioCtx.createGain();
    n2.gain.setValueAtTime(.04,time);
    n2.gain.exponentialRampToValueAtTime(.001,time+n.d*.4);
    o2.connect(n2);n2.connect(gain);
    o2.start(time);o2.stop(time+n.d);

    // Warm sine body
    const o3=audioCtx.createOscillator();o3.type='sine';o3.frequency.value=n.f;
    const n3=audioCtx.createGain();
    n3.gain.setValueAtTime(.25,time);
    n3.gain.exponentialRampToValueAtTime(.01,time+n.d*.9);
    o3.connect(n3);n3.connect(gain);
    o3.start(time);o3.stop(time+n.d);

    // Bass chord at start of each phrase
    noteInPhrase++;
    if(noteInPhrase===1){
      chords[Math.min(phraseIdx,3)].forEach(cf=>{
        const ob=audioCtx.createOscillator();ob.type='sine';ob.frequency.value=cf;
        const gb=audioCtx.createGain();
        gb.gain.setValueAtTime(.06,time);
        gb.gain.exponentialRampToValueAtTime(.005,time+1.8);
        ob.connect(gb);gb.connect(gain);
        ob.start(time);ob.stop(time+2);
      });
    }
    if(noteInPhrase>=phraseLens[phraseIdx]){noteInPhrase=0;phraseIdx++;}

    time+=n.d+.04;
  });
  gain.gain.setValueAtTime(.18,time-.3);
  gain.gain.linearRampToValueAtTime(0,time+.8);
  setTimeout(()=>{bdayPlaying=false;},time*1000+1000);
}

// ─── PARTICLES ───
let parts=[];
function emitP(x,y,n,o){
  for(let i=0;i<n;i++) parts.push({
    x,y,vx:(Math.random()-.5)*(o.sp||3),vy:(Math.random()-.5)*(o.sp||3)-(o.rise||0),
    life:1,dec:.006+Math.random()*.012,
    sz:o.sz||2+Math.random()*3,
    col:o.cols[~~(Math.random()*o.cols.length)],
    shape:o.shape||'dot'
  });
}
function tickParts(){
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.x+=p.vx;p.y+=p.vy;
    p.vy+=p.shape==='confetti'?.12:.02;
    p.life-=p.dec;
    if(p.life<=0)parts.splice(i,1);
  }
}
function drawParts(){
  parts.forEach(p=>{
    cx.globalAlpha=p.life;cx.fillStyle=p.col;
    if(p.shape==='heart')drawHeart(p.x,p.y,p.sz*2);
    else if(p.shape==='confetti'){
      cx.save();cx.translate(p.x,p.y);cx.rotate(p.vx*sceneT*.1);
      cx.fillRect(-p.sz/2,-p.sz/2,p.sz,p.sz*1.4);cx.restore();
    }else{cx.beginPath();cx.arc(p.x,p.y,p.sz,0,Math.PI*2);cx.fill();}
    cx.globalAlpha=1;
  });
}
function drawHeart(x,y,s){
  cx.save();cx.translate(x,y);const r=s/15;
  cx.beginPath();cx.moveTo(0,-3*r);
  cx.bezierCurveTo(-7.5*r,-12*r,-15*r,0,0,10*r);
  cx.bezierCurveTo(15*r,0,7.5*r,-12*r,0,-3*r);
  cx.fill();cx.restore();
}

function rr(x,y,w,h,r){
  cx.beginPath();cx.moveTo(x+r,y);cx.lineTo(x+w-r,y);
  cx.quadraticCurveTo(x+w,y,x+w,y+r);cx.lineTo(x+w,y+h-r);
  cx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);cx.lineTo(x+r,y+h);
  cx.quadraticCurveTo(x,y+h,x,y+h-r);cx.lineTo(x,y+r);
  cx.quadraticCurveTo(x,y,x+r,y);cx.closePath();
}
function fillRR(x,y,w,h,r){rr(x,y,w,h,r);cx.fill();}

// ─── CHARACTER ───
function drawPerson(x,y,sc,o={}){
  const s=sc,face=o.face||1,walk=o.walk||0,arm=o.arm||0,tilt=o.tilt||0;
  const mood=o.mood||'',kind=o.kind||'M',skin=o.skin||'#e8b89d';
  const kneel=o.kneel||false;

  cx.save();cx.translate(x,y);cx.scale(face,1);
  cx.fillStyle='rgba(0,0,0,.12)';
  cx.beginPath();cx.ellipse(0,2,16*s,4*s,0,0,Math.PI*2);cx.fill();

  if(kind==='M'||kind==='GM'){
    const coat=kind==='GM'?'#8B0000':'#1e1b4b';
    const coat2=kind==='GM'?'#600':'#12103a';

    if(kneel){
      // Kneeling pose - one knee down
      // Back leg (kneeling)
      cx.save();cx.translate(6*s,-10*s);
      cx.fillStyle='#191930';fillRR(-4*s,0,8*s,14*s,3*s);
      cx.fillStyle='#111';fillRR(-3*s,12*s,8*s,5*s,2*s);
      cx.restore();
      // Front leg (forward)
      cx.save();cx.translate(-6*s,-28*s);
      cx.rotate(-30*Math.PI/180);
      cx.fillStyle='#191930';fillRR(-3.5*s,0,7*s,26*s,3*s);
      cx.fillStyle='#111';fillRR(-4*s,22*s,10*s,5*s,2.5*s);
      cx.restore();
      // Torso (lowered)
      cx.fillStyle=coat;fillRR(-14*s,-52*s,28*s,38*s,5*s);
      cx.fillStyle=coat2;
      cx.beginPath();cx.moveTo(-8*s,-52*s);cx.lineTo(0,-37*s);cx.lineTo(8*s,-52*s);cx.fill();
      cx.fillStyle='#eee';
      cx.beginPath();cx.moveTo(-5*s,-52*s);cx.lineTo(0,-45*s);cx.lineTo(5*s,-52*s);cx.fill();
      cx.fillStyle=kind==='GM'?'#FFD700':'#c084fc';
      cx.beginPath();cx.moveTo(-2*s,-51*s);cx.lineTo(2*s,-51*s);
      cx.lineTo(1.5*s,-37*s);cx.lineTo(-1.5*s,-37*s);cx.fill();
      // Arms - one extended offering
      cx.save();cx.translate(-14*s,-47*s);cx.rotate(-40*Math.PI/180);
      cx.fillStyle=coat;fillRR(-3.5*s,0,8*s,24*s,3*s);
      cx.fillStyle=skin;cx.beginPath();cx.arc(.5*s,26*s,4*s,0,Math.PI*2);cx.fill();
      cx.restore();
      cx.save();cx.translate(14*s,-47*s);cx.rotate(20*Math.PI/180);
      cx.fillStyle=coat;fillRR(-4.5*s,0,8*s,24*s,3*s);
      cx.fillStyle=skin;cx.beginPath();cx.arc(-.5*s,26*s,4*s,0,Math.PI*2);cx.fill();
      cx.restore();
      // Neck
      cx.fillStyle=skin;fillRR(-4*s,-59*s,8*s,9*s,2*s);
      // Head
      cx.save();cx.translate(0,-72*s);cx.rotate(tilt*Math.PI/180);
      cx.fillStyle=skin;cx.beginPath();cx.ellipse(0,0,12*s,14*s,0,0,Math.PI*2);cx.fill();
      cx.fillStyle=o.hair||'#111';
      cx.beginPath();cx.ellipse(0,-7*s,13*s,10*s,0,Math.PI,Math.PI*2);cx.fill();
      fillRR(-13*s,-10*s,5*s,8*s,2*s);
      drawEyes(0,-1*s,s,mood);
      drawMouth(0,6*s,s,mood);
      cx.restore();
    } else {
      // Standing pose
      [-1,1].forEach((side,i)=>{
        cx.save();cx.translate(side*5*s,-30*s);
        cx.rotate((i===0?1:-1)*Math.sin(walk)*12*Math.PI/180);
        cx.fillStyle='#191930';fillRR(-3.5*s,0,7*s,28*s,3*s);
        cx.fillStyle='#111';fillRR(-4.5*s,24*s,10*s,5*s,2.5*s);
        cx.restore();
      });
      cx.fillStyle=coat;fillRR(-14*s,-65*s,28*s,38*s,5*s);
      cx.fillStyle=coat2;
      cx.beginPath();cx.moveTo(-8*s,-65*s);cx.lineTo(0,-50*s);cx.lineTo(8*s,-65*s);cx.fill();
      cx.fillStyle='#eee';
      cx.beginPath();cx.moveTo(-5*s,-65*s);cx.lineTo(0,-58*s);cx.lineTo(5*s,-65*s);cx.fill();
      cx.fillStyle=kind==='GM'?'#FFD700':'#c084fc';
      cx.beginPath();cx.moveTo(-2*s,-64*s);cx.lineTo(2*s,-64*s);
      cx.lineTo(1.5*s,-50*s);cx.lineTo(-1.5*s,-50*s);cx.fill();
      [-1,1].forEach((side,i)=>{
        cx.save();cx.translate(side*14*s,-60*s);
        const aRot=(side===1?arm:-arm)+Math.sin(walk+i*Math.PI)*8;
        cx.rotate(aRot*Math.PI/180);
        cx.fillStyle=coat;fillRR(-3.5*s,0,8*s,24*s,3*s);
        cx.fillStyle=skin;cx.beginPath();cx.arc(.5*s,26*s,4*s,0,Math.PI*2);cx.fill();
        cx.restore();
      });
      cx.fillStyle=skin;fillRR(-4*s,-72*s,8*s,9*s,2*s);
      cx.save();cx.translate(0,-85*s);cx.rotate(tilt*Math.PI/180);
      cx.fillStyle=skin;cx.beginPath();cx.ellipse(0,0,12*s,14*s,0,0,Math.PI*2);cx.fill();
      cx.fillStyle=o.hair||'#111';
      cx.beginPath();cx.ellipse(0,-7*s,13*s,10*s,0,Math.PI,Math.PI*2);cx.fill();
      fillRR(-13*s,-10*s,5*s,8*s,2*s);
      drawEyes(0,-1*s,s,mood);
      drawMouth(0,6*s,s,mood);
      if(kind==='GM'){
        cx.fillStyle='#FFD700';
        cx.beginPath();cx.ellipse(0,-14*s,15*s,9*s,0,Math.PI,Math.PI*2);cx.fill();
        cx.fillStyle='#ff4500';cx.beginPath();cx.arc(0,-20*s,4*s,0,Math.PI*2);cx.fill();
      }
      cx.restore();
    }

  } else {
    const dress=kind==='BF'?'#dc143c':o.dress||'#c084fc';
    const dress2=kind==='BF'?'#8B0000':o.dress2||'#7c3aed';
    cx.fillStyle=dress;
    cx.beginPath();cx.moveTo(-12*s,-62*s);cx.lineTo(-19*s,-2*s);
    cx.quadraticCurveTo(-19*s,3*s,-15*s,3*s);
    cx.lineTo(15*s,3*s);cx.quadraticCurveTo(19*s,3*s,19*s,-2*s);
    cx.lineTo(12*s,-62*s);cx.fill();
    cx.strokeStyle=dress2;cx.lineWidth=1*s;cx.globalAlpha=.25;
    for(let i=0;i<3;i++){
      cx.beginPath();cx.moveTo(-15*s+i*2*s,(-45+i*14)*s);
      cx.quadraticCurveTo(0,(-38+i*14)*s,15*s-i*2*s,(-45+i*14)*s);cx.stroke();
    }
    cx.globalAlpha=1;
    if(kind==='BF'){cx.fillStyle='#FFD700';fillRR(-19*s,-7*s,38*s,6*s,1*s);}
    cx.fillStyle=kind==='BF'?'#FFD700':'#dba0c0';
    [-1,1].forEach(side=>{cx.beginPath();cx.ellipse(side*6*s,4*s,5*s,2.5*s,0,0,Math.PI*2);cx.fill();});
    [-1,1].forEach((side,i)=>{
      cx.save();cx.translate(side*12*s,-56*s);
      cx.rotate(((side===1?arm:-arm)+5)*Math.PI/180);
      cx.fillStyle=skin;fillRR(-3*s,0,6*s,22*s,3*s);
      cx.beginPath();cx.arc(.5*s*side,24*s,4*s,0,Math.PI*2);cx.fill();
      if(kind==='BF'){cx.strokeStyle='#FFD700';cx.lineWidth=2*s;
        cx.beginPath();cx.arc(0,20*s,5*s,0,Math.PI*2);cx.stroke();}
      cx.restore();
    });
    cx.fillStyle=skin;fillRR(-3.5*s,-68*s,7*s,8*s,2*s);
    if(kind==='BF'){cx.strokeStyle='#FFD700';cx.lineWidth=1.5*s;
      cx.beginPath();cx.arc(0,-62*s,7*s,0,Math.PI);cx.stroke();}
    cx.save();cx.translate(0,-82*s);cx.rotate(tilt*Math.PI/180);
    cx.fillStyle=skin;cx.beginPath();cx.ellipse(0,0,11*s,13*s,0,0,Math.PI*2);cx.fill();
    cx.fillStyle=o.hair||'#0a0a0a';
    cx.beginPath();cx.ellipse(0,-5*s,13*s,11*s,0,Math.PI,Math.PI*2);cx.fill();
    fillRR(-13*s,-8*s,4.5*s,16*s,2*s);fillRR(8.5*s,-8*s,4.5*s,16*s,2*s);
    drawEyes(0,-1*s,s,mood,true);drawMouth(0,5.5*s,s,mood);
    if(kind==='BF'){
      cx.fillStyle='#FFD700';cx.beginPath();cx.arc(0,-12*s,2.5*s,0,Math.PI*2);cx.fill();
      cx.fillStyle='#dc143c';cx.beginPath();cx.arc(0,-12*s,1.2*s,0,Math.PI*2);cx.fill();
      cx.fillStyle='#dc143c';cx.beginPath();cx.arc(0,-4*s,1.8*s,0,Math.PI*2);cx.fill();
      cx.fillStyle='#FFD700';
      cx.beginPath();cx.arc(-11*s,5*s,2.5*s,0,Math.PI*2);cx.fill();
      cx.beginPath();cx.arc(11*s,5*s,2.5*s,0,Math.PI*2);cx.fill();

function drawBike(x,y,s,rot){
  cx.save();cx.translate(x,y);
  cx.strokeStyle='#444';cx.lineWidth=2.5*s;
  [-1,1].forEach(side=>{
    const wx=side*18*s;
    cx.beginPath();cx.arc(wx,12*s,13*s,0,Math.PI*2);cx.stroke();
    cx.lineWidth=.8*s;
    for(let i=0;i<5;i++){
      const a=i*Math.PI/2.5+rot*3;
      cx.beginPath();cx.moveTo(wx,12*s);
      cx.lineTo(wx+Math.cos(a)*11*s,12*s+Math.sin(a)*11*s);cx.stroke();
    }
    cx.lineWidth=2.5*s;
    cx.fillStyle='#555';cx.beginPath();cx.arc(wx,12*s,2.5*s,0,Math.PI*2);cx.fill();
  });
  cx.strokeStyle='#b91c1c';cx.lineWidth=2.5*s;
  cx.beginPath();cx.moveTo(-18*s,12*s);cx.lineTo(0,-4*s);cx.lineTo(18*s,12*s);
  cx.moveTo(0,-4*s);cx.lineTo(-8*s,-12*s);
  cx.moveTo(0,-4*s);cx.lineTo(12*s,-4*s);cx.lineTo(18*s,12*s);cx.stroke();
  cx.fillStyle='#222';cx.beginPath();cx.ellipse(10*s,-6*s,7*s,2.5*s,-.05,0,Math.PI*2);cx.fill();
  cx.strokeStyle='#333';cx.lineWidth=2*s;
  cx.beginPath();cx.moveTo(-12*s,-16*s);cx.lineTo(-8*s,-12*s);cx.lineTo(-4*s,-14*s);cx.stroke();
  cx.restore();
}

function drawPhoto(x,y,w,h,rot){
  cx.save();cx.translate(x,y);cx.rotate(rot);
  cx.shadowColor='rgba(0,0,0,.25)';cx.shadowBlur=12;
  cx.fillStyle='#f8f8f0';fillRR(-w/2-6,-h/2-6,w+12,h+22,3);
  cx.shadowBlur=0;
  cx.fillStyle='#fce4ec';cx.fillRect(-w/2,-h/2,w,h);
  // Girl face - clearly feminine
  cx.fillStyle='#e8b89d';cx.beginPath();cx.ellipse(0,-1,w*.22,w*.27,0,0,Math.PI*2);cx.fill();
  // Long flowing hair
  cx.fillStyle='#0a0a0a';
  cx.beginPath();cx.ellipse(0,-10,w*.28,w*.22,0,Math.PI,Math.PI*2);cx.fill();
  // Hair sides flowing down past face
  cx.beginPath();cx.moveTo(-w*.26,-6);cx.quadraticCurveTo(-w*.3,10,-w*.2,h*.35);
  cx.lineTo(-w*.14,h*.35);cx.quadraticCurveTo(-w*.2,8,-w*.18,-6);cx.fill();
  cx.beginPath();cx.moveTo(w*.26,-6);cx.quadraticCurveTo(w*.3,10,w*.2,h*.35);
  cx.lineTo(w*.14,h*.35);cx.quadraticCurveTo(w*.2,8,w*.18,-6);cx.fill();
  // Eyes with lashes
  [-1,1].forEach(side=>{
    const ex=side*w*.09;
    cx.fillStyle='#fff';cx.beginPath();cx.ellipse(ex,-3,3,2.5,0,0,Math.PI*2);cx.fill();
    cx.fillStyle='#1a1030';cx.beginPath();cx.arc(ex,-3,1.5,0,Math.PI*2);cx.fill();
    cx.strokeStyle='#111';cx.lineWidth=1;
    cx.beginPath();cx.arc(ex,-3,3,-Math.PI*.8,-Math.PI*.2);cx.stroke();
  });
  // Smile with lipstick
  cx.fillStyle='#d04060';
  cx.beginPath();cx.arc(0,4,3,.15,Math.PI-.15);cx.fill();
  // Earrings
  cx.fillStyle='#FFD700';
  cx.beginPath();cx.arc(-w*.2,4,2,0,Math.PI*2);cx.fill();
  cx.beginPath();cx.arc(w*.2,4,2,0,Math.PI*2);cx.fill();
  cx.restore();
}

  cx.fillStyle=g;cx.fillRect(0,H*.68,W,H*.32);

  // Kolam pattern on floor
  cx.strokeStyle='rgba(255,255,255,.08)';cx.lineWidth=1;
  for(let i=0;i<4;i++){cx.beginPath();cx.arc(W/2,H*.82,25+i*18,0,Math.PI*2);cx.stroke();}

  // Temple gopuram (tower) silhouette in background

  cx.beginPath();cx.moveTo(W*.35,H*.1);cx.lineTo(W*.38,H*.1);

  cx.beginPath();cx.arc(W*.365,H*.09,4,0,Math.PI*2);cx.fill();
  cx.beginPath();cx.arc(W*.635,H*.09,4,0,Math.PI*2);cx.fill();

  // Temple pillars - ornate South Indian style
  [W*.25,W*.38,W*.62,W*.75].forEach(px=>{
    // Pillar shaft
    g=cx.createLinearGradient(px-7,0,px+7,0);

    cx.fillStyle='#c09020';

  });

  // Arch between inner pillars
  cx.strokeStyle='#c09020';cx.lineWidth=3;
  cx.beginPath();cx.arc(W/2,H*.2,W*.12,Math.PI,Math.PI*2);cx.stroke();
  // Inner decorative arch
  cx.strokeStyle='#e0a030';cx.lineWidth=1.5;
  cx.beginPath();cx.arc(W/2,H*.2,W*.1,Math.PI,Math.PI*2);cx.stroke();

  // Garlands (mango leaves + flowers)
  for(let g2=0;g2<2;g2++){

    cx.beginPath();cx.moveTo(W*.25,H*.2+g2*3);
    cx.quadraticCurveTo(W*.5,H*.28+Math.sin(t*1.5+g2)*3+g2*4,W*.75,H*.2+g2*3);cx.stroke();
  }
  // Flower details on garland
  ['#e04060','#e8a020','#fff'].forEach((col,ci)=>{
    for(let i=0;i<8;i++){
      const fx=W*.28+i*(W*.44/7);
      const fy=H*.22+Math.sin(i*.8)*4+ci*2;
      cx.fillStyle=col;cx.beginPath();cx.arc(fx,fy,2,0,Math.PI*2);cx.fill();

  // Sacred fire (homa kundam)

  // Oil lamps (deepam) on both sides

    // Flame

    cx.fillStyle=lglow;cx.fillRect(dx-30,dy-58,60,60);

  // Floating petals
  cx.globalAlpha=.3;
  ['#ec4899','#e04060','#e8a020','#fff'].forEach((col,i)=>{

      const px2=(W*.08+(i*181+j*277)%(W*.84));

    }
  });

}

function chatBubble(ph,text,me,yOff,p2){
  if(p2<=0)return;
  const{px,py,pw}=ph;
  cx.font='12px system-ui';
  const bw=Math.min(pw*.62,cx.measureText(text).width+22);
  const bh=28,bx=me?px+pw-10-bw:px+14,by=py+72+yOff;
  cx.globalAlpha=Math.min(p2*2,1);
  const sc2=EIB(Math.min(p2*1.5,1));
  cx.save();cx.translate(bx+(me?bw:0),by);cx.scale(sc2,sc2);cx.translate(-(bx+(me?bw:0)),-by);
  cx.fillStyle=me?'#5b21b6':'#1e1040';fillRR(bx,by,bw,bh,12);
  cx.fillStyle='#eee';cx.textAlign=me?'right':'left';
  cx.fillText(text,me?bx+bw-12:bx+12,by+18);
  cx.textAlign='left';cx.restore();cx.globalAlpha=1;
}

  }
  cx.globalAlpha=1;

  // Floating bokeh circles (premium feel)
  for(let i=0;i<18;i++){
    const bkx=W*.05+(i*173)%(W*.9);
    const bky=H*.05+Math.sin(t*.4+i*1.3)*H*.06+(i*97)%(H*.75);
    const bkr=3+Math.sin(t*.7+i)*2+(i%5)*2;
    cx.globalAlpha=.04+Math.sin(t+i*.8)*.02;
    g=cx.createRadialGradient(bkx,bky,0,bkx,bky,bkr);
    g.addColorStop(0,'rgba(249,168,212,.4)');g.addColorStop(.6,'rgba(168,85,247,.15)');g.addColorStop(1,'rgba(0,0,0,0)');
    cx.fillStyle=g;cx.beginPath();cx.arc(bkx,bky,bkr,0,Math.PI*2);cx.fill();
  }
  cx.globalAlpha=1;

  // Sparkle stars
  for(let i=0;i<30;i++){
    const sx=W*.03+(i*151)%(W*.94),sy=H*.03+(i*89)%(H*.85);
    const twinkle=Math.sin(t*3+i*2.1)*.5+.5;
    cx.globalAlpha=twinkle*.25;cx.fillStyle='#fff';
    const ssz=.8+twinkle*1.2;
    // 4-point star shape
    cx.beginPath();cx.moveTo(sx,sy-ssz*2);cx.lineTo(sx+ssz*.5,sy);cx.lineTo(sx,sy+ssz*2);
    cx.lineTo(sx-ssz*.5,sy);cx.closePath();cx.fill();
    cx.beginPath();cx.moveTo(sx-ssz*2,sy);cx.lineTo(sx,sy+ssz*.5);cx.lineTo(sx+ssz*2,sy);
    cx.lineTo(sx,sy-ssz*.5);cx.closePath();cx.fill();
  }
  cx.globalAlpha=1;

  // Glassmorphism card for Happy Birthday text
  const cardW=Math.min(W*.7,420),cardH=70,cardX=W/2-cardW/2,cardY=H*.14;
  // Card blur/glass effect
  cx.fillStyle='rgba(255,255,255,.06)';fillRR(cardX,cardY,cardW,cardH,20);
  cx.strokeStyle='rgba(255,255,255,.1)';cx.lineWidth=1;
  cx.beginPath();rr(cardX,cardY,cardW,cardH,20);cx.stroke();
  // Inner glow
  g=cx.createLinearGradient(cardX,cardY,cardX,cardY+cardH);
  g.addColorStop(0,'rgba(255,255,255,.08)');g.addColorStop(1,'rgba(255,255,255,0)');
  cx.fillStyle=g;fillRR(cardX,cardY,cardW,cardH/2,20);

  // Elegant typography - gradient text
  const fs=Math.min(28,W*.05);
  cx.font=`300 ${fs}px system-ui`;cx.textAlign='center';
  cx.fillStyle='#f9a8d4';
  cx.shadowColor='rgba(236,72,153,.4)';cx.shadowBlur=20;
  cx.fillText('Happy Birthday',W/2,cardY+cardH/2-2);
  cx.font=`600 ${fs*1.1}px system-ui`;
  cx.fillStyle='#fff';
  cx.fillText('My Love',W/2,cardY+cardH/2+fs*1.1-2);
  cx.shadowBlur=0;

  // Elegant golden balloons (3D-ish with gradient)
  const bCols=[['#ec4899','#be185d'],['#f43f5e','#b91c1c'],['#c084fc','#7c3aed'],['#f9a8d4','#ec4899'],['#fbbf24','#d97706']];
  for(let i=0;i<10;i++){
    const bx=W*.04+i*W*.1,by=H*.04+Math.sin(t*1.2+i*.7)*10+(i%3)*6;
    const br=10+i%3*4;
    g=cx.createRadialGradient(bx-br*.2,by-br*.3,br*.1,bx,by,br);
    const bc=bCols[i%5];
    g.addColorStop(0,'rgba(255,255,255,.3)');g.addColorStop(.3,bc[0]);g.addColorStop(1,bc[1]);
    cx.fillStyle=g;cx.beginPath();cx.ellipse(bx,by,br*.8,br,0,0,Math.PI*2);cx.fill();
    // String
    cx.strokeStyle='rgba(255,255,255,.08)';cx.lineWidth=.7;
    cx.beginPath();cx.moveTo(bx,by+br);
    cx.bezierCurveTo(bx+Math.sin(t+i)*4,by+br+20,bx-Math.sin(t+i)*3,by+br+40,bx,by+br+55);cx.stroke();
  }

  // Guy - kneeling after t>2, walks in first
  const guyX=W/2;
  if(t<2){
    // Walking in from left
    const wx=lerp(W*.1,guyX,EO(clamp(t/1.8,0,1)));
    drawPerson(wx,H*.82,1.3,{kind:'M',mood:'happy',walk:t<1.8?t*3:0,
      arm:-10+Math.sin(t*3)*5});
  } else {
    // Kneeling
    const kneelProg=EO(clamp((t-2)/.8,0,1));
    if(kneelProg<1){
      drawPerson(guyX,H*.82,1.3,{kind:'M',mood:'happy',arm:-15});
    } else {
      drawPerson(guyX,H*.82,1.3,{kind:'M',mood:'happy',kneel:true,
        tilt:Math.sin(t*1.5)*3});

  }

  // Funny text sequence with glassmorphism speech cards
  const texts=[
    {t:3,text:"Hey Beautiful! 🌹",dur:2},
    {t:5.5,text:"Happy Birthday to the most amazing person! 🎉",dur:2.5},
    {t:8.5,text:"I got you a gift... but first... 😏",dur:2},
    {t:11,text:"You gotta EARN it! 💪😈",dur:2}
  ];
  texts.forEach(tx=>{
    if(t>tx.t && t<tx.t+tx.dur){
      const ap=EO(clamp((t-tx.t)/.5,0,1));
      const fp=1-EO(clamp((t-tx.t-tx.dur+.5)/.5,0,1));
      const alpha=Math.min(ap,fp);
      cx.globalAlpha=alpha;
      // Glass card behind text
      const tfs=Math.min(18,W*.032);
      cx.font=`600 ${tfs}px system-ui`;
      const tw=cx.measureText(tx.text).width+40;
      const th=36;
      cx.fillStyle='rgba(255,255,255,.07)';fillRR(W/2-tw/2,H*.53-th/2,tw,th,14);
      cx.strokeStyle='rgba(255,255,255,.1)';cx.lineWidth=.8;
      cx.beginPath();rr(W/2-tw/2,H*.53-th/2,tw,th,14);cx.stroke();
      // Text with glow
      cx.fillStyle='#fff';
      cx.textAlign='center';
      cx.shadowColor='rgba(236,72,153,.5)';cx.shadowBlur=20;
      cx.fillText(tx.text,W/2,H*.53+6);
      cx.shadowBlur=0;
      cx.globalAlpha=1;
    }
  });

  // Confetti - pink/black/rose
  if(Math.random()<.25)
    emitP(Math.random()*W,-5,1,{shape:'confetti',
      cols:['#ec4899','#f43f5e','#f9a8d4','#1a1a2e','#be185d','#fbbf24'],sp:2.5,rise:-1.5,sz:4.5});

  // Hearts rising
  if(t>2&&Math.random()<.08)
    emitP(guyX+(Math.random()-.5)*60,H*.65,1,{shape:'heart',
      cols:['#ec4899','#f43f5e','#f9a8d4'],sp:1.5,rise:2,sz:4});

  tickParts();drawParts();
}

const SCENES=[S0,S1,S2,S3,S4,S5,S6,S7];
const DURS=[10,10,9,11,9,8,9,14];

let curScene=-1,sceneStart=0;
let timers=[];
function clearT(){timers.forEach(clearTimeout);timers=[];}

function playScene(idx){
  if(idx>=SCENES.length){
    setTimeout(()=>{document.getElementById('skipBtn').style.display='none';startQuiz();},400);
    return;
  }
  curScene=idx;sceneStart=performance.now();parts=[];
  if(idx===0)playRomanticMelody();
  if(idx===7){stopRomanticMelody();playBdayTune();}
  timers.push(setTimeout(()=>playScene(idx+1),DURS[idx]*1000));
}

function mainLoop(now){
  requestAnimationFrame(mainLoop);
  if(curScene<0||curScene>=SCENES.length)return;
  const t=(now-sceneStart)/1000;
  sceneT=t;
  cx.clearRect(0,0,W,H);
  SCENES[curScene](t);
  cx.fillStyle='#000';cx.fillRect(0,0,W,H*.055);cx.fillRect(0,H*.945,W,H*.055);
  const total=DURS.reduce((a,b)=>a+b,0);
  let elapsed=0;
  for(let i=0;i<curScene;i++)elapsed+=DURS[i];
  elapsed+=Math.min(t,DURS[curScene]);
  const p2=elapsed/total;
  cx.fillStyle='rgba(255,255,255,.08)';fillRR(W*.1,H*.97,W*.8,2.5,1);
  cx.fillStyle='#ec4899';fillRR(W*.1,H*.97,W*.8*p2,2.5,1);
}

function begin(){
  initAudio();
  document.getElementById('titleScreen').classList.add('gone');
  document.getElementById('skipBtn').style.display='block';
  setTimeout(()=>playScene(0),800);
}

function skipToQuiz(){
  clearT();curScene=-1;stopRomanticMelody();
  document.getElementById('skipBtn').style.display='none';
  startQuiz();
}

document.getElementById('titleScreen').addEventListener('click',begin);
requestAnimationFrame(mainLoop);

window.pick=function(i){
  if(answered)return;
  const q=QS[qi],opts=document.querySelectorAll('.qOpt');

  if(i===q.ans){
    // CORRECT
    answered=true;
    opts[i].classList.add('right');opts[i].textContent+=' ✅';
    if(wrongCounts[qi]===0)sc++;
    setTimeout(()=>{qi++;qi<QS.length?loadQ():endQuiz();},1100);
  } else {
    // WRONG
    wrongCounts[qi]++;
    opts[i].classList.add('wrong');

    if(!hasLost){
      // First wrong answer ever → "YOU LOST" → light reveal → eternal lives
      answered=true;
      firstAttemptWrong.push(qi);
      setTimeout(()=>showLostSequence(),1000);
    } else {
      // Has eternal lives → mark wrong, keep going, must find right answer
      firstAttemptWrong.push(qi);
      // Grey out this wrong option, let them try again
      setTimeout(()=>{
        opts[i].classList.add('dead');
        opts[i].textContent+=' ✗';
        answered=false; // allow picking again
      },600);
    }
  }
};

window.popBalloon=function(idx,color){
  const b=document.getElementById('bl'+idx);
  if(!b||b.dataset.popped)return;
  b.dataset.popped='1';
  const rect=b.getBoundingClientRect();
  const area=document.getElementById('balloonArea');
  const aRect=area.getBoundingClientRect();
  const cx=rect.left-aRect.left+rect.width/2;
  const cy=rect.top-aRect.top+rect.height/2;
  let pieces='';
  for(let i=0;i<8;i++){
    const ang=(Math.PI*2/8)*i;
    const dist=30+Math.random()*40;
    const tx=Math.cos(ang)*dist;const ty=Math.sin(ang)*dist;
    const sz=4+Math.random()*6;
    pieces+=`<div class="popPiece" style="left:${cx}px;top:${cy}px;width:${sz}px;height:${sz}px;
      background:${color};--tx:${tx}px;--ty:${ty}px"></div>`;
  }
  area.insertAdjacentHTML('beforeend',`<div class="popEffect">${pieces}</div>`);
  b.style.transform='scale(1.3)';b.style.opacity='0';b.style.transition='all .15s';
  setTimeout(()=>b.style.display='none',200);
  window._balloonPopped++;
  document.getElementById('balloonCount').textContent=`${window._balloonPopped} / ${window._balloonTotal} popped`;
  if(window._balloonPopped>=window._balloonTotal){
    setTimeout(()=>{
      confettiBurst();
      setTimeout(()=>{
        document.getElementById('balloonUI').classList.remove('show');
        showCake();
      },1500);
    },500);
  }
};

// ── 4. ROSE BOUQUET (Canvas-painted realistic roses) ──
function paintRoseBouquet(canvas){
  const dpr=window.devicePixelRatio||1;
  const W=800,H=1040;
  canvas.width=W*dpr;canvas.height=H*dpr;
  canvas.style.width='100%';canvas.style.height='100%';
  const ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);

  function drawPetal(cx,cy,angle,len,wid,color1,color2,alpha){
    ctx.save();
    ctx.translate(cx,cy);
    ctx.rotate(angle);
    ctx.globalAlpha=alpha||.92;
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.bezierCurveTo(-wid*.7,-len*.25,-wid*.65,-len*.9,-wid*.1,-len);
    ctx.bezierCurveTo(wid*.15,-len*1.02,wid*.65,-len*.9,wid*.4,-len*.5);
    ctx.bezierCurveTo(wid*.55,-len*.3,wid*.3,-len*.08,0,0);
    const g=ctx.createRadialGradient(-wid*.1,-len*.55,len*.08,-wid*.05,-len*.5,len*.65);
    g.addColorStop(0,color2);
    g.addColorStop(.45,color1);
    g.addColorStop(.8,color2);
    g.addColorStop(1,`rgba(60,0,0,.15)`);
    ctx.fillStyle=g;
    ctx.shadowColor='rgba(80,0,0,.15)';
    ctx.shadowBlur=5;
    ctx.fill();
    ctx.globalAlpha=.06;
    ctx.strokeStyle='rgba(255,220,220,.5)';
    ctx.lineWidth=.7;
    ctx.stroke();
    ctx.restore();
  }

  function drawRose(cx,cy,size,hueShift){
    const h=350+hueShift;
    const layers=[
      {count:8,len:size*1.0,wid:size*.6,lMin:22,lMax:30,sat:84,aBase:.85},
      {count:7,len:size*.82,wid:size*.52,lMin:28,lMax:38,sat:82,aBase:.88},
      {count:6,len:size*.65,wid:size*.42,lMin:35,lMax:48,sat:80,aBase:.9},
      {count:5,len:size*.48,wid:size*.32,lMin:45,lMax:58,sat:76,aBase:.92},
      {count:4,len:size*.32,wid:size*.22,lMin:55,lMax:68,sat:72,aBase:.95},
      {count:3,len:size*.2,wid:size*.14,lMin:65,lMax:75,sat:68,aBase:.97}
    ];
    ctx.save();
    ctx.shadowColor='rgba(100,10,10,.22)';
    ctx.shadowBlur=10;
    ctx.shadowOffsetY=4;
    layers.forEach((L,li)=>{
      const angleOff=li*.52+li*.17;
      for(let i=0;i<L.count;i++){
        const a=angleOff+(i/L.count)*Math.PI*2+(Math.random()-.5)*.2;
        const ll=L.lMin+Math.random()*(L.lMax-L.lMin);
        const c1=`hsl(${h+(li*2)},${L.sat}%,${ll}%)`;
        const c2=`hsl(${h-(li)},${L.sat+5}%,${Math.max(15,ll-10)}%)`;
        drawPetal(cx,cy,a,L.len,L.wid,c1,c2,L.aBase-(i*.008));
      }
    });
    ctx.globalAlpha=.6;
    const cg=ctx.createRadialGradient(cx,cy-2,0,cx,cy-2,size*.2);
    cg.addColorStop(0,`hsl(${h},60%,78%)`);
    cg.addColorStop(.6,`hsl(${h},75%,50%)`);
    cg.addColorStop(1,`hsl(${h},85%,35%)`);
    ctx.fillStyle=cg;
    ctx.beginPath();ctx.arc(cx,cy-2,size*.18,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=.3;ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(cx-size*.05,cy-size*.07,size*.07,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }

  function drawStem(x1,y1,x2,y2,cpx,cpy,w){
    ctx.save();
    ctx.strokeStyle='#2e7d32';ctx.lineWidth=w;ctx.lineCap='round';
    ctx.shadowColor='rgba(0,60,0,.1)';ctx.shadowBlur=3;
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.quadraticCurveTo(cpx,cpy,x2,y2);ctx.stroke();
    ctx.strokeStyle='#43a047';ctx.lineWidth=w*.4;ctx.globalAlpha=.3;
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.quadraticCurveTo(cpx+2,cpy,x2+1,y2);ctx.stroke();
    ctx.restore();
  }

  function drawLeaf(cx,cy,angle,sc){
    ctx.save();
    ctx.translate(cx,cy);ctx.rotate(angle);ctx.scale(sc,sc);
    ctx.globalAlpha=.88;
    const lg=ctx.createLinearGradient(-30,0,0,0);
    lg.addColorStop(0,'#2e7d32');lg.addColorStop(.5,'#43a047');lg.addColorStop(1,'#388e3c');
    ctx.fillStyle=lg;
    ctx.beginPath();
    ctx.moveTo(0,0);ctx.bezierCurveTo(-8,-6,-20,-10,-32,-5);
    ctx.bezierCurveTo(-36,-2,-36,2,-32,5);
    ctx.bezierCurveTo(-20,10,-8,6,0,0);
    ctx.fill();
    ctx.strokeStyle='#2e7d32';ctx.lineWidth=.8;ctx.globalAlpha=.4;
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-30,0);ctx.stroke();
    ctx.lineWidth=.5;ctx.globalAlpha=.25;
    ctx.beginPath();ctx.moveTo(-10,0);ctx.lineTo(-18,-4);ctx.stroke();
    ctx.beginPath();ctx.moveTo(-18,0);ctx.lineTo(-25,3);ctx.stroke();
    ctx.restore();
  }

  function drawWrapPaper(){
    ctx.save();
    ctx.shadowColor='rgba(0,0,0,.18)';ctx.shadowBlur=16;ctx.shadowOffsetY=8;
    const wg=ctx.createLinearGradient(0,380,0,950);
    wg.addColorStop(0,'#fdf8f2');wg.addColorStop(.15,'#faf6ef');wg.addColorStop(.4,'#f5ede0');wg.addColorStop(1,'#e8dcc8');
    ctx.fillStyle=wg;
    ctx.beginPath();
    ctx.moveTo(195,400);ctx.bezierCurveTo(180,440,230,820,265,950);
    ctx.lineTo(535,950);ctx.bezierCurveTo(570,820,620,440,605,400);
    ctx.closePath();ctx.fill();
    ctx.globalAlpha=.08;
    ctx.fillStyle='rgba(0,0,0,.04)';
    ctx.beginPath();
    ctx.moveTo(195,400);ctx.bezierCurveTo(180,440,230,820,265,950);
    ctx.lineTo(535,950);ctx.bezierCurveTo(570,820,620,440,605,400);
    ctx.closePath();ctx.fill();
    ctx.globalAlpha=1;
    ctx.strokeStyle='rgba(190,175,150,.15)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(280,420);ctx.quadraticCurveTo(270,680,288,940);ctx.stroke();
    ctx.beginPath();ctx.moveTo(350,410);ctx.quadraticCurveTo(345,720,342,944);ctx.stroke();
    ctx.beginPath();ctx.moveTo(460,410);ctx.quadraticCurveTo(464,720,468,944);ctx.stroke();
    ctx.beginPath();ctx.moveTo(530,420);ctx.quadraticCurveTo(540,680,522,940);ctx.stroke();

    ctx.fillStyle='#fdf8f2';ctx.strokeStyle='rgba(210,195,170,.25)';ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(175,408);
    const ruffleY=408;
    [[210,370],[245,408],[285,362],[325,408],[365,358],[405,408],[445,360],[485,408],[525,370],[565,408],[625,408]].forEach(([px,py])=>{
      ctx.quadraticCurveTo(px,py,px+18,ruffleY);
    });
    ctx.lineTo(625,408);ctx.lineTo(175,408);ctx.closePath();
    ctx.fill();ctx.stroke();
    ctx.globalAlpha=.5;ctx.fillStyle='rgba(245,237,224,.6)';
    ctx.beginPath();ctx.moveTo(180,405);
    [[215,378],[248,405],[288,372],[328,405],[368,368],[408,405],[448,370],[488,405],[528,378],[568,405],[622,405]].forEach(([px,py])=>{
      ctx.quadraticCurveTo(px,py,px+16,405);
    });
    ctx.lineTo(622,405);ctx.lineTo(180,405);ctx.closePath();ctx.fill();
    ctx.restore();
  }

  function drawRibbon(){
    ctx.save();
    const rx=400,ry=630;
    ctx.lineWidth=8;ctx.lineCap='round';
    const rg=ctx.createLinearGradient(rx-40,ry,rx+40,ry);
    rg.addColorStop(0,'#e53935');rg.addColorStop(.5,'#d32f2f');rg.addColorStop(1,'#b71c1c');
    ctx.strokeStyle=rg;
    ctx.beginPath();ctx.moveTo(rx-8,ry+12);ctx.bezierCurveTo(rx-16,ry+40,rx-24,ry+70,rx-42,ry+100);ctx.stroke();
    ctx.beginPath();ctx.moveTo(rx+8,ry+12);ctx.bezierCurveTo(rx+16,ry+40,rx+24,ry+70,rx+42,ry+100);ctx.stroke();
    ctx.fillStyle=rg;
    ctx.beginPath();
    ctx.moveTo(rx-3,ry);ctx.bezierCurveTo(rx-18,ry-14,rx-42,ry-28,rx-56,ry-12);
    ctx.bezierCurveTo(rx-68,ry+4,rx-52,ry+28,rx-32,ry+24);
    ctx.bezierCurveTo(rx-18,ry+20,rx-6,ry+8,rx-3,ry);ctx.fill();
    ctx.beginPath();
    ctx.moveTo(rx+3,ry);ctx.bezierCurveTo(rx+18,ry-14,rx+42,ry-28,rx+56,ry-12);
    ctx.bezierCurveTo(rx+68,ry+4,rx+52,ry+28,rx+32,ry+24);
    ctx.bezierCurveTo(rx+18,ry+20,rx+6,ry+8,rx+3,ry);ctx.fill();
    ctx.globalAlpha=.15;ctx.fillStyle='#fff';
    ctx.beginPath();ctx.ellipse(rx-34,ry-6,12,5,-.3,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(rx+34,ry-6,12,5,.3,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
    ctx.fillStyle='#c62828';
    ctx.beginPath();ctx.ellipse(rx,ry+3,12,9,0,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=.2;ctx.fillStyle='#fff';
    ctx.beginPath();ctx.ellipse(rx-3,ry,4,3,0,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }

  function drawBabysBreath(){
    ctx.save();
    const spots=[[356,96],[452,88],[280,184],[536,176],[380,260],[430,276],[310,324],[504,316],[400,84],[296,116],[516,110],[350,370],[460,364]];
    spots.forEach(([bx,by])=>{
      for(let i=0;i<6;i++){
        const ox=(Math.random()-.5)*22,oy=(Math.random()-.5)*22;
        const r=2+Math.random()*2.5;
        ctx.globalAlpha=.35+Math.random()*.35;
        ctx.fillStyle='#fff';
        ctx.shadowColor='rgba(255,255,255,.3)';ctx.shadowBlur=3;
        ctx.beginPath();ctx.arc(bx+ox,by+oy,r,0,Math.PI*2);ctx.fill();
      }
    });
    ctx.restore();
  }

  function drawDewdrops(){
    ctx.save();
    const drops=[[365,190],[440,160],[310,250],[500,230],[380,310],[420,120],[350,140],[470,280]];
    drops.forEach(([dx,dy])=>{
      const r=1.5+Math.random()*1.5;
      ctx.globalAlpha=.4;
      const dg=ctx.createRadialGradient(dx-r*.3,dy-r*.3,0,dx,dy,r*1.5);
      dg.addColorStop(0,'rgba(255,255,255,.8)');
      dg.addColorStop(.5,'rgba(255,255,255,.2)');
      dg.addColorStop(1,'transparent');
      ctx.fillStyle=dg;
      ctx.beginPath();ctx.arc(dx,dy,r*2,0,Math.PI*2);ctx.fill();
      ctx.globalAlpha=.7;ctx.fillStyle='#fff';
      ctx.beginPath();ctx.arc(dx-r*.2,dy-r*.3,r*.4,0,Math.PI*2);ctx.fill();
    });
    ctx.restore();
  }

  ctx.clearRect(0,0,W,H);

  const stems=[
    [400,560,376,280,390,450,6],[400,560,440,250,420,440,5.5],
    [400,560,320,270,360,440,5.5],[400,560,490,270,440,440,5],

    [400,560,360,200,385,470,5],[400,560,450,190,408,470,5],
    [400,560,280,230,356,460,4.5],[400,560,525,240,444,460,4.5],
    [400,560,340,350,380,500,3.5],[400,560,465,340,420,500,3.5]
  ];
  stems.forEach(s=>drawStem(...s));

  const leaves=[
    [305,410,-.7,1.4],[505,400,.6,1.4],[270,370,-1.0,1.2],[540,375,.85,1.2],

  ];
  leaves.forEach(l=>drawLeaf(...l));

  drawWrapPaper();
  drawRibbon();

  const roses=[
    [400,195,48,0],[335,230,44,-5],[465,220,44,5],

    [365,145,46,2],[440,140,44,-3],
    [305,180,40,-10],[500,170,40,9],
    [265,235,36,-12],[542,228,36,11],
    [400,315,42,0],[340,340,38,3],[465,330,38,-4],
    [315,125,40,-7],[490,118,40,6],
    [400,105,48,1],[350,100,38,-6],[455,95,38,4],

    [290,160,34,-9],[515,155,34,8]
  ];
  roses.forEach(r=>drawRose(...r));

  drawBabysBreath();
  drawDewdrops();
}

function svgHeartTree(flip){

  return `<svg viewBox="0 0 120 200" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%">
  <g ${tx}>

function typewriterLetter(){
  const dear='Dear Shree,';
  const body='Happy Birthday to someone truly special! 🎂\n\nYou are Sweet, Loyal, My rock, and I\'m so grateful to have you in my life.\n\nYou bring so much warmth and sweetness into my life. Every moment with you is precious.\n\nOn your special day, I wish you all the happiness in the world!';
  const dearEl=document.getElementById('letterDear');
  const bodyEl=document.getElementById('letterBody');
  let di=0,bi=0;
  bodyEl.innerHTML='<span class="typeCursor"></span>';
  function typeDear(){
    if(di<dear.length){
      dearEl.textContent=dear.slice(0,++di);
      setTimeout(typeDear,60);
    } else {
      setTimeout(typeBody,300);
    }
  }
  function typeBody(){
    if(bi<body.length){
      const ch=body[bi];
      bi++;
      if(ch==='\n'){
        bodyEl.innerHTML=bodyEl.innerHTML.replace('<span class="typeCursor"></span>','')+'<br><span class="typeCursor"></span>';
      } else {
        const cursor=bodyEl.querySelector('.typeCursor');
        if(cursor)cursor.insertAdjacentText('beforebegin',ch);
      }
      const delay=ch==='.'||ch==='!'||ch==='?'?120:ch===','?80:ch==='\n'?200:28;
      setTimeout(typeBody,delay);
    } else {
      bodyEl.innerHTML=bodyEl.innerHTML.replace('<span class="typeCursor"></span>','');
      document.getElementById('letterContinueBtn').classList.add('visible');
    }
  }
  typeDear();
}

function drawTeddy(){
  const c2=document.getElementById('tc');if(!c2)return;
  const t=c2.getContext('2d');
  const cw=320,ch=360;c2.width=cw;c2.height=ch;
  const cx2=cw/2,cy2=ch/2-10;

  // Colors matching the actual teddy: tan/cream
  const fur='#dbb88a',furL='#e8cda5',furD='#c4a070';

  // Soft shadow
  t.fillStyle='rgba(0,0,0,.1)';t.beginPath();t.ellipse(cx2,cy2+148,65,14,0,0,Math.PI*2);t.fill();

  // LEGS (thick plush legs)
  [-1,1].forEach(side=>{
    const lx=cx2+side*30;
    // Upper leg
    const lg=t.createLinearGradient(lx-20,cy2+80,lx+20,cy2+80);
    lg.addColorStop(0,furD);lg.addColorStop(.5,fur);lg.addColorStop(1,furD);
    t.fillStyle=lg;
    t.beginPath();t.ellipse(lx,cy2+105,24,40,side*.1,0,Math.PI*2);t.fill();
    // Foot pad
    t.fillStyle=furL;t.beginPath();t.ellipse(lx+side*4,cy2+138,16,10,side*.2,0,Math.PI*2);t.fill();
  });

  // BODY (big round plush belly)
  let bg=t.createRadialGradient(cx2-10,cy2+15,10,cx2,cy2+30,70);
  bg.addColorStop(0,furL);bg.addColorStop(.6,fur);bg.addColorStop(1,furD);
  t.fillStyle=bg;t.beginPath();t.ellipse(cx2,cy2+35,62,68,0,0,Math.PI*2);t.fill();
  // Belly seam line
  t.strokeStyle='rgba(160,120,70,.15)';t.lineWidth=1;
  t.beginPath();t.moveTo(cx2,cy2-20);t.lineTo(cx2,cy2+95);t.stroke();

  // ARMS (curved plush arms)
  [-1,1].forEach(side=>{
    const ax=cx2+side*58;
    const ag=t.createLinearGradient(ax-18,cy2,ax+18,cy2);
    ag.addColorStop(0,side<0?furD:fur);ag.addColorStop(1,side<0?fur:furD);
    t.fillStyle=ag;
    t.beginPath();t.ellipse(ax,cy2+20,18,38,side*.35,0,Math.PI*2);t.fill();

    t.fillStyle=furL;t.beginPath();t.ellipse(ax+side*6,cy2+48,12,10,side*.3,0,Math.PI*2);t.fill();
  });

  // HEAD
  bg=t.createRadialGradient(cx2-8,cy2-55,10,cx2,cy2-42,52);
  bg.addColorStop(0,furL);bg.addColorStop(.7,fur);bg.addColorStop(1,furD);
  t.fillStyle=bg;t.beginPath();t.ellipse(cx2,cy2-42,48,46,0,0,Math.PI*2);t.fill();

  // EARS
  [-1,1].forEach(side=>{
    t.fillStyle=fur;t.beginPath();t.arc(cx2+side*38,cy2-82,18,0,Math.PI*2);t.fill();
    t.fillStyle=furL;t.beginPath();t.arc(cx2+side*38,cy2-82,10,0,Math.PI*2);t.fill();
  });

  // WHITE MUZZLE (big white area around nose/mouth - matches photo)
  t.fillStyle='#f5f0ea';
  t.beginPath();t.ellipse(cx2,cy2-30,30,26,0,0,Math.PI*2);t.fill();

  // EYES - green/hazel eyes matching photo
  [-1,1].forEach(side=>{
    const ex=cx2+side*16,ey=cy2-52;
    // Eye socket shadow
    t.fillStyle='rgba(0,0,0,.06)';t.beginPath();t.ellipse(ex,ey,10,11,0,0,Math.PI*2);t.fill();

    t.fillStyle='#f8f8f0';t.beginPath();t.ellipse(ex,ey,8,9,0,0,Math.PI*2);t.fill();
    // Iris (green/olive like the actual teddy)

    // Inner iris detail

    // Pupil

    // Catchlight
    t.fillStyle='#fff';t.beginPath();t.arc(ex+side*2+1,ey-2,2,0,Math.PI*2);t.fill();
    t.fillStyle='rgba(255,255,255,.4)';t.beginPath();t.arc(ex-side,ey+3,1,0,Math.PI*2);t.fill();

  // NOSE (big round brown nose)

  // MOUTH - big smile (stitched look like the actual teddy)

  // Right scarf tail

  t.lineTo(cx2+3,cy2+33);t.quadraticCurveTo(cx2+10,cy2+12,cx2+2,cy2);t.fill();
  // Brown stripe on right tail
  t.fillStyle='#a07040';
  t.beginPath();t.moveTo(cx2+6,cy2+12);t.quadraticCurveTo(cx2+14,cy2+22,cx2+11,cy2+35);

  // Red fringe at bottom of each tail
  t.strokeStyle='#8b2020';t.lineWidth=1.2;
  for(let i=0;i<5;i++){

  t.beginPath();t.ellipse(cx2,cy2-8,35,8,.05,Math.PI,Math.PI*2);t.fill();
  t.fillStyle='#f5f0ea';
  t.beginPath();t.ellipse(cx2,cy2-6,32,6,.05,Math.PI,Math.PI*2);t.fill();

  // Fur texture hints (subtle lines)
  t.strokeStyle='rgba(160,120,70,.06)';t.lineWidth=.5;

}

// Animated gift page background — floating hearts, bokeh, gentle aurora
function startGiftBg(){
  const gc=document.getElementById('giftBg');if(!gc)return;
  gc.width=W*dpr;gc.height=H*dpr;
  const g2=gc.getContext('2d');g2.setTransform(dpr,0,0,dpr,0,0);

  // Create particles
  const hearts=[];const bokeh=[];
  for(let i=0;i<15;i++)hearts.push({
    x:Math.random()*W,y:H+Math.random()*H*.3,
    vx:(Math.random()-.5)*.3,vy:-.3-Math.random()*.5,
    sz:6+Math.random()*8,a:Math.random()*6.28,
    col:['#ec4899','#f43f5e','#f9a8d4','#c084fc'][~~(Math.random()*4)],
    op:.08+Math.random()*.12
  });
  for(let i=0;i<20;i++)bokeh.push({
    x:Math.random()*W,y:Math.random()*H,
    r:15+Math.random()*40,
    col:['rgba(236,72,153,','rgba(168,85,247,','rgba(249,168,212,'][~~(Math.random()*3)],
    op:.02+Math.random()*.03,phase:Math.random()*6.28
  });

  let gT=0;
  (function drawGBg(){
    g2.clearRect(0,0,W,H);gT+=.01;

    // Gradient base
    const bg=g2.createRadialGradient(W*.3,H*.2,50,W/2,H/2,W*.8);
    bg.addColorStop(0,'#0c0018');bg.addColorStop(.5,'#0a0012');bg.addColorStop(1,'#040008');
    g2.fillStyle=bg;g2.fillRect(0,0,W,H);

    // Aurora waves
    g2.globalAlpha=.04;
    for(let i=0;i<3;i++){
      const wy=H*.15+i*H*.25;
      const wg=g2.createLinearGradient(0,wy,W,wy);
      wg.addColorStop(0,'rgba(0,0,0,0)');wg.addColorStop(.3,i%2?'#ec4899':'#a855f7');
      wg.addColorStop(.7,i%2?'#a855f7':'#ec4899');wg.addColorStop(1,'rgba(0,0,0,0)');
      g2.fillStyle=wg;
      g2.beginPath();g2.moveTo(0,wy);
      for(let x=0;x<=W;x+=8)g2.lineTo(x,wy+Math.sin(x/W*Math.PI*3+gT*2+i)*H*.015);
      g2.lineTo(W,wy+H*.06);g2.lineTo(0,wy+H*.06);g2.fill();
    }
    g2.globalAlpha=1;

    // Bokeh circles
    bokeh.forEach(b=>{
      const pulse=Math.sin(gT*2+b.phase)*.5+.5;
      g2.globalAlpha=b.op*(.5+pulse*.5);
      const bg2=g2.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r);
      bg2.addColorStop(0,b.col+'.3)');bg2.addColorStop(.5,b.col+'.1)');bg2.addColorStop(1,b.col+'0)');
      g2.fillStyle=bg2;g2.beginPath();g2.arc(b.x,b.y,b.r,0,Math.PI*2);g2.fill();
    });
    g2.globalAlpha=1;

    // Floating hearts
    hearts.forEach(h=>{
      h.x+=h.vx+Math.sin(gT*3+h.a)*.15;h.y+=h.vy;
      if(h.y<-20){h.y=H+20;h.x=Math.random()*W;}
      g2.globalAlpha=h.op;g2.fillStyle=h.col;
      g2.save();g2.translate(h.x,h.y);g2.rotate(Math.sin(gT+h.a)*.2);
      const s=h.sz/15;
      g2.beginPath();g2.moveTo(0,-3*s);
      g2.bezierCurveTo(-7.5*s,-12*s,-15*s,0,0,10*s);
      g2.bezierCurveTo(15*s,0,7.5*s,-12*s,0,-3*s);
      g2.fill();g2.restore();
    });
    g2.globalAlpha=1;

    // Sparkle stars
    for(let i=0;i<15;i++){
      const sx=(i*179+37)%W,sy=(i*113+51)%H;
      const tw=Math.sin(gT*4+i*2.7)*.5+.5;
      g2.globalAlpha=tw*.15;g2.fillStyle='#fff';
      const ss=.5+tw;
      g2.beginPath();g2.moveTo(sx,sy-ss*2);g2.lineTo(sx+ss*.4,sy);
      g2.lineTo(sx,sy+ss*2);g2.lineTo(sx-ss*.4,sy);g2.fill();
      g2.beginPath();g2.moveTo(sx-ss*2,sy);g2.lineTo(sx,sy+ss*.4);
      g2.lineTo(sx+ss*2,sy);g2.lineTo(sx,sy-ss*.4);g2.fill();
    }
    g2.globalAlpha=1;

    requestAnimationFrame(drawGBg);
  })();
}

function confettiBurst(parent){
  const cc=document.createElement('canvas');
  cc.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:50';
  cc.width=W*dpr;cc.height=H*dpr;document.body.appendChild(cc);
  const c2=cc.getContext('2d');c2.setTransform(dpr,0,0,dpr,0,0);
  const cols=['#ec4899','#f43f5e','#f9a8d4','#c084fc','#fbbf24','#a855f7','#34d399'];
  const ps=[];
  // Burst from center-top in all directions
  for(let i=0;i<200;i++){
    const angle=Math.random()*Math.PI*2;
    const speed=2+Math.random()*6;
    ps.push({
      x:W/2+(Math.random()-.5)*W*.3,y:H*.1+Math.random()*H*.2,
      vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed-2,
      sz:2+Math.random()*5,col:cols[~~(Math.random()*cols.length)],
      rot:Math.random()*6.28,rv:(Math.random()-.5)*.15,
      shape:Math.random()>.6?'rect':'circle',op:1
    });
  }
  let frame=0;
  (function anim(){
    c2.clearRect(0,0,W,H);let alive=false;frame++;
    ps.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;p.vy+=.06;p.rot+=p.rv;p.vx*=.99;
      p.op=Math.max(0,1-frame/180);
      if(p.y<H+20&&p.op>0)alive=true;
      c2.globalAlpha=p.op;
      c2.save();c2.translate(p.x,p.y);c2.rotate(p.rot);
      c2.fillStyle=p.col;
      if(p.shape==='circle'){c2.beginPath();c2.arc(0,0,p.sz/2,0,Math.PI*2);c2.fill();}
      else c2.fillRect(-p.sz/2,-p.sz/2,p.sz,p.sz*1.5);
      c2.restore();
    });
    c2.globalAlpha=1;
    if(alive)requestAnimationFrame(anim);
    else cc.remove();
  })();
}

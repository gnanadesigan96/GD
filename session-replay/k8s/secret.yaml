# DO NOT commit this file with real values.
# Create this secret with kubectl instead (see README).
#
#   kubectl create secret generic session-replay-azure \
#     --namespace session-replay \
#     --from-literal=connection-string="DefaultEndpointsProtocol=https;AccountName=..."
#
# OR use Azure Workload Identity (recommended) — then no secret is needed.
# Just annotate the ServiceAccount below.
apiVersion: v1
kind: Secret
metadata:
  name: session-replay-azure
  namespace: session-replay
type: Opaque
stringData:
  connection-string: "REPLACE_ME"        # paste your Azure Storage connection string
  container: "session-replay"
